<script>
const SHEET_MIRROR_STORES = ['LEAD_MASTER','FOLLOWUPS','FOLLOWUP_HISTORY','LEAD_ACTIVITY_LOGS','LEAD_FIELD_VALUES','FOLLOWUP_FIELD_VALUES','PIPELINE_STAGES','FIELD_CONFIG','CONFIG','Bulk_Config','CALL_LOGS','VISIT_SUBMISSIONS','CLIENT_FACTORY_VISITS','CLIENT_FACTORY_VISIT_EVENTS','DQ_MASTER','DQ_FOLLOWUPS','DQ_FOLLOWUP_HISTORY','DQ_CONFIG','AR_MASTER','AR_FOLLOWUPS','AR_FOLLOWUP_HISTORY','AR_CONFIG'];

function sheetMirrorValidRecords(records, total) {
  if (!Array.isArray(records) || records.length !== total || !records.length) return false;
  const first = records[0], meta = first.value;
  if (first.bucket !== '_meta' || first.index !== 0 || !meta || meta.schemaVersion !== 1 || !SHEET_MIRROR_STORES.includes(meta.name) ||
      !Array.isArray(meta.headers) || !meta.headers.every(h => typeof h === 'string') || !Array.isArray(meta.redactedColumns) || meta.rowCount !== total - 1) return false;
  let last = 1;
  return records.slice(1).every(row => {
    if (row.bucket !== 'rows' || !Number.isSafeInteger(row.index) || row.index <= last || !row.value || !Array.isArray(row.value.cells) ||
        row.value.cells.length !== meta.headers.length || !Array.isArray(row.value.dates)) return false;
    last = row.index;
    return row.value.cells.every(v => v === null || ['string','boolean'].includes(typeof v) || typeof v === 'number' && Number.isFinite(v)) &&
      row.value.dates.every(i => Number.isInteger(i) && i >= 0 && i < meta.headers.length && typeof row.value.cells[i] === 'string' && Number.isFinite(Date.parse(row.value.cells[i]))) &&
      meta.redactedColumns.every(i => Number.isInteger(i) && i >= 0 && i < meta.headers.length && row.value.cells[i] === null);
  });
}

function createSheetMirrorStorage(indexedDB) {

          if(req.result.objectStoreNames.contains(name)) return;
          const store = req.result.createObjectStore(name, { keyPath: ['snapshotKey','rowNumber'] });
          store.createIndex('snapshotKey', 'snapshotKey');

      tx.onabort = tx.onerror = () => { active.delete(tx); reject(new Error('Sheet storage transaction failed; the previous complete data was retained.')); };

  }
  function cancel(name) {

    for (const tx of active) if (!name || tx.objectStoreNames.contains(name)) { try { tx.abort(); } catch (_) {} }
  }
  function deleteRows(store, key, then) {
    const cursor = store.index('snapshotKey').openCursor(key);
    cursor.onsuccess = () => {
      if (cursor.result) { cursor.result.delete(); cursor.result.continue(); }
      else then();
    };
  }
  const clear = async () => {
    cancel();
    return transaction(['_meta', ...SHEET_MIRROR_STORES], 'readwrite', tx => {
      ['_meta', ...SHEET_MIRROR_STORES].forEach(name => tx.objectStore(name).clear());
    });
  };

    catalog: () => transaction(['_meta'], 'readonly', (tx, done) => { const request = tx.objectStore('_meta').getAll(); request.onsuccess = () => done(request.result.filter(row => row.schema && row.snapshot)); }),
    bind(identity) {
      cancel();
      const scope = JSON.stringify([identity.portal, identity.workbook, identity.user, identity.scope]);
      return transaction(['_meta', ...SHEET_MIRROR_STORES], 'readwrite', tx => {
        const meta = tx.objectStore('_meta'), req = meta.get('__identity');
        req.onsuccess = () => {
          if (req.result && req.result.scope === scope) return;

          meta.put({ key: '__identity', scope });

      });
    },
    table(name) {
      if (!SHEET_MIRROR_STORES.includes(name)) throw new Error('Unknown mirror store');
      return {
        cancel: () => cancel(name),
        clear,
        get: key => transaction(['_meta', name], 'readonly', (tx, done) => {
          let meta, rows;
          const finish = () => { if (meta !== undefined && rows !== undefined) done(meta ? { ...meta.snapshot, rows: [meta.schema, ...rows.map(row => ({ bucket: 'rows', index: row.rowNumber, value: { cells: row.cells, dates: row.dates } }))] } : null); };
          const m = tx.objectStore('_meta').get(key); m.onsuccess = () => { meta = m.result || null; finish(); };
          const r = tx.objectStore(name).index('snapshotKey').getAll(key); r.onsuccess = () => { rows = r.result; finish(); };
        }),
        put: snapshot => transaction(['_meta', name], 'readwrite', tx => {
          if (!sheetMirrorValidRecords(snapshot.rows, snapshot.total) || snapshot.rows[0].value.name !== name) throw new Error('Invalid mirror snapshot');
          const store = tx.objectStore(name), { rows, ...metadata } = snapshot;
          deleteRows(store, snapshot.key, () => {
            rows.slice(1).forEach(row => store.put({ snapshotKey: snapshot.key, rowNumber: row.index, cells: row.value.cells, dates: row.value.dates }));
            tx.objectStore('_meta').put({ key: snapshot.key, schema: rows[0], snapshot: metadata });
          });
        }),
        remove: key => transaction(['_meta', name], 'readwrite', tx => {
          deleteRows(tx.objectStore(name), key, () => tx.objectStore('_meta').delete(key));
        })

    }

}

function createSheetMirror({ request, storage, onLock = () => {}, changed = () => {}, now = () => Date.now() }) {

  const locked = e => /CACHE_SCOPE_CHANGED|CACHE_DISABLED|SESSION_EXPIRED|ACCESS[_ ]DENIED|FORBIDDEN|Permission denied/i.test(String(e.message || '') + ' ' + (e.code || ''));

    if (identity && storage.bind) bound = storage.bind(identity);

    if (identity && storage.catalog) bound = bound.then(async () => {
      const saved = await storage.catalog();

        .map(row => ({ name: row.schema.value.name, exists: row.schema.value.exists, rows: row.schema.value.rowCount, verifiedAt: row.snapshot.verifiedAt, preview: true }));

  async function fail(e) {

  async function manifest() {

    if (!same(result.identity)) throw new Error('CACHE_SCOPE_CHANGED');
    if (!Array.isArray(result.sheets) || result.sheets.some(sheet => !SHEET_MIRROR_STORES.includes(sheet.name)) || new Set(result.sheets.map(sheet => sheet.name)).size !== result.sheets.length) throw new Error('Invalid sheet catalog');

  }
  function entryFor(name) {
    if (!catalog.some(sheet => sheet.name === name)) throw new Error('Permission denied. Sheet is outside this account’s catalog.');

      const local = storage.table(name), context = { ...identity };
      const client = createLeadReadCache({ namespace: 'sheet:' + identity.workbook + ':' + name, storage: local, validateRows: sheetMirrorValidRecords, retainSnapshotOnReplace: true,
        request: async query => {
          const page = await request('apiGetSheetMirrorPage', { ...query, workbook: context.workbook, sheet: name, wireFormat: 'json-v1' });

  }
  async function syncSheet(name) {
    const session = epoch, entry = entryFor(name); entry.verified = false; changed();
    try {
      await entry.client.load({ force: true });
      if (session !== epoch) throw new Error('CACHE_CANCELLED');
      if (entry.client.status().storage === 'unavailable') throw new Error('IndexedDB could not save ' + name + '. Free browser storage and retry.');
      const stored = await entry.storage.get(key(name));
      if (session !== epoch || !stored || !sheetMirrorValidRecords(stored.rows, stored.total)) throw new Error('CACHE_CANCELLED');
      const rows = stored.rows;

  function syncAll(force = false) {
    if (!identity) return Promise.resolve();

  async function readSheet(name) {
    if (!identity) throw new Error('Sheet sync is not enabled.');
    const session = epoch;

      await manifest(); await syncSheet(name);

        rows: result.rows.slice(1).map(row => ({ rowNumber: row.index, cells: row.value.cells, dates: row.value.dates })) };

  async function previewSheet(name) {
    if (!identity || !SHEET_MIRROR_STORES.includes(name)) return null;
    const session = epoch; await bound;
    if (session !== epoch || !catalog.some(sheet => sheet.name === name)) return null;

  }
  async function previewLeads() {
    if (!identity || !identity.leadListAllowed || !identity.timeZone) return null;
    const session = epoch, zone = identity.timeZone;
    const saved = await previewSheet('LEAD_MASTER');
    if (session !== epoch || !saved || !saved.exists) return null;
    const headers = saved.headers.map(header => header.trim());
    const present = headers.filter(Boolean);

    const formatter = new Intl.DateTimeFormat('en-GB', {timeZone:zone, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
    const dates = value => {
      const parts = Object.fromEntries(formatter.formatToParts(new Date(value)).map(part => [part.type, part.value]));

    };

    for (const row of saved.rows) {
      const record = Object.fromEntries(headers.map((header, i) => [header, row.dates.includes(i) ? dates(row.cells[i]) : row.cells[i]])
        .filter(([header]) => header && !/password|passwd|secret|credential|authorization|cookie|session|token|api[ _-]?key|__proto__|constructor|prototype/i.test(header)));
      if (!record['Lead ID']) continue;
      if (ids.has(String(record['Lead ID']))) return null;
      ids.add(String(record['Lead ID']));

      data.push({...record, _previewSource:'sheet-mirror'});

    // Never persist this projection as a complete apiGetLeads response.
    return {data, verifiedAt:saved.verifiedAt, partial:true};
  }
  async function previewLeadDetail(leadId, central = false) {
    if (!identity || !identity.timeZone || !leadId) return null;

    const names = central === 'archive' ? ['AR_MASTER','AR_FOLLOWUPS','AR_FOLLOWUP_HISTORY'] : central ? ['DQ_MASTER','DQ_FOLLOWUPS','DQ_FOLLOWUP_HISTORY'] :
      ['LEAD_MASTER','FOLLOWUPS','FOLLOWUP_HISTORY','LEAD_ACTIVITY_LOGS'];
    const saved = await Promise.all(names.map(name => previewSheet(name)));
    if (session !== epoch || !saved[0]?.exists) return null;
    const formatter = new Intl.DateTimeFormat('en-GB', {timeZone:zone, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});

      if (!snapshot?.exists) return null;
      const headers = snapshot.headers.map(h => h.trim()), present = headers.filter(Boolean);

        Object.fromEntries(headers.map((h,i) => {

            const p = Object.fromEntries(formatter.formatToParts(new Date(value)).map(part => [part.type,part.value]));
            value = `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}:${p.second}`;
          }
          return [h,value];
        }).filter(([h]) => h && !/password|passwd|secret|credential|authorization|cookie|session|token|api[ _-]?key|__proto__|constructor|prototype/i.test(h))));
    }
    const rows = saved.map(records), parents = rows[0];
    if (!parents || parents.length !== 1 || central && !(central === 'archive' ? ['Transferred','Trashed'] : ['Transferred']).includes(parents[0]['Transfer State'])) return null;
    const data = {lead:parents[0]};

    return {data, verifiedAt:new Date(Math.min(...saved.filter(Boolean).map(s => Date.parse(s.verifiedAt)))).toISOString(), partial:true};
  }
  const archiveSheets = ['AR_MASTER','AR_FOLLOWUPS','AR_FOLLOWUP_HISTORY','LEAD_MASTER','FOLLOWUPS','FOLLOWUP_HISTORY'];

    if (archiveSync) return archiveSync;
    const session = epoch;
    const task = (async () => {
      await manifest();

  async function previewArchiveData() {
    if (!identity || !identity.timeZone) return null;

    await bound;
    const names = archiveSheets.filter(name => catalog.some(sheet => sheet.name === name));

    const tables = {};

        if(row.dates.includes(i)) { const d=Object.fromEntries(formatter.formatToParts(new Date(value)).map(p=>[p.type,p.value])); value=`${d.year}-${d.month}-${d.day} ${d.hour}:${d.minute}:${d.second}`; }
        return [h,value];

      const open=followups.filter(r=>String(r.Status||'').toLowerCase()!=='closed').sort((a,b)=>String(b['Created At']||'').localeCompare(String(a['Created At']||'')))[0];

  }

    invalidate() { dirty++; lastSync = 0; clients.forEach(entry => { entry.verified = false; entry.client.verifyNext(); }); },
    status: () => ({ enabled: !!identity, running: !!running, lastSync, error, excluded: [...excluded],
      sheets: catalog.map(sheet => { const entry = clients.get(sheet.name); return { ...sheet, rows: entry && entry.rows != null ? entry.rows : sheet.rows,
        state: entry && entry.error ? 'error' : entry && entry.verified ? 'synced' : sheet.preview ? 'saved preview' : entry ? entry.client.status().state : 'waiting',

}

const SheetMirror = createSheetMirror({
  request: (fn, query) => api._read(fn, AuthToken.get(), query), storage: createSheetMirrorStorage(leadIndexedDb_()),
  onLock: () => { void lockPrivateReadCache(); },
  changed: event => { if (typeof renderSheetMirrorStatus === 'function') renderSheetMirrorStatus(event); }
});

</script>
