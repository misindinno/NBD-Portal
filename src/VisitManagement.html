<script>
let visitManagementQuery={search:'',status:'',page:1};
async function loadVisitManagement(prefetched){
 const box=el('content');if(!window.__PAGE_PREVIEW_READY)box.innerHTML=skeletonPage('table');
 try{
  const data=prefetched || await pagePreviewRead('apiVisitManagement',[{...visitManagementQuery}],data=>loadVisitManagement(data));
  if(App.currentPage!=='visitmanagement')return;
  box.innerHTML=`<div class="card" style="padding:24px;margin-bottom:18px"><h2>Visits</h2><p>Public visit requests and team updates.</p><label>Public form link</label><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="visit-public-url" class="form-control" readonly value="${escapeHtml(data.url)}" style="flex:1"><button id="visit-copy" class="btn btn-outlined">Copy link</button><a class="btn btn-primary" href="${escapeHtml(data.url)}" target="_blank" rel="noopener">Open form</a></div><button id="visit-toggle" class="btn btn-outlined" style="margin-top:12px">${data.enabled?'Pause public form':'Enable public form'}</button></div>
  <div class="card" style="padding:20px"><form id="visit-search" style="display:flex;gap:10px;flex-wrap:wrap"><input class="form-control" id="visit-query" placeholder="Search clients or remarks" value="${escapeHtml(visitManagementQuery.search)}"><select class="form-control" id="visit-status"><option value="">All statuses</option>${data.statuses.map(s=>`<option ${visitManagementQuery.status===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select><button class="btn btn-primary">Search</button></form><p>${data.total} visits · Page ${data.page}</p><div class="table-wrap"><table><thead><tr><th>Client</th><th>Visit date</th><th>Status</th><th>Details</th></tr></thead><tbody>${data.rows.map((r,i)=>`<tr><td>${escapeHtml(r['Client Name'])}</td><td>${escapeHtml(r['Visit Date'])}</td><td>${escapeHtml(r.Status)}</td><td><details><summary>View / manage</summary>${remarkHtml(r.Remarks)}<small>Submitted: ${escapeHtml(r['Submitted At'])}<br>Visit ID: ${escapeHtml(r['Visit ID'])}</small><form data-visit-index="${i}"><label>Status<select name="status" class="form-control">${data.statuses.map(s=>`<option ${s===r.Status?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></label><label>Team notes<textarea name="notes" class="form-control" maxlength="2000">${escapeHtml(r['Management Notes'])}</textarea></label><button class="btn btn-primary" style="margin-top:8px">Save update</button></form></details></td></tr>`).join('')||'<tr><td colspan="4">No visits found.</td></tr>'}</tbody></table></div><div style="display:flex;gap:10px;margin-top:16px"><button id="visit-prev" class="btn btn-outlined" ${data.page<=1?'disabled':''}>Previous</button><button id="visit-next" class="btn btn-outlined" ${data.page*50>=data.total?'disabled':''}>Next</button></div></div>`;
  el('visit-copy').onclick=async()=>{const input=el('visit-public-url');try{await navigator.clipboard.writeText(input.value);toast('Link copied');}catch(_){input.focus();input.select();toast('Select and copy the link');}};
  el('visit-search').onsubmit=e=>{e.preventDefault();visitManagementQuery={search:el('visit-query').value,status:el('visit-status').value,page:1};loadVisitManagement();};
  el('visit-prev').onclick=()=>{visitManagementQuery.page=data.page-1;loadVisitManagement();};el('visit-next').onclick=()=>{visitManagementQuery.page=data.page+1;loadVisitManagement();};
  el('visit-toggle').onclick=async e=>{e.target.disabled=true;try{await api._authedRead('apiSetPublicVisitEnabled',!data.enabled);await loadVisitManagement();}catch(err){toast(err.message,'error');e.target.disabled=false;}};
  box.querySelectorAll('[data-visit-index]').forEach(form=>{form.onsubmit=async e=>{e.preventDefault();const r=data.rows[Number(form.dataset.visitIndex)],button=form.querySelector('button');button.disabled=true;try{await api._authedRead('apiUpdateManagedVisit',{id:r['Visit ID'],status:form.elements.status.value,notes:form.elements.notes.value,updatedAt:r['Updated At']});toast('Visit updated');await loadVisitManagement();}catch(err){toast(err.message,'error');button.disabled=false;}};});
 }catch(err){if(App.currentPage==='visitmanagement')box.innerHTML=`<div class="card" style="padding:24px">${escapeHtml(err.message)} <button class="btn btn-outlined" onclick="loadVisitManagement()">Retry</button></div>`;}
}
</script>
