<script>
async function loadWebhooks() {
  const container = el('content');
  container.innerHTML = skeletonPage('table');
  try {
    const data = await api.getCallWebhook();
    if (App.currentPage !== 'webhooks') return;
    container.innerHTML = `
      <div class="card" style="padding:22px;margin-bottom:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
          <div><h3>Callyzer call webhook</h3><p style="color:#64748b;margin-top:6px">Add call notes, results, timings and recordings to each lead's remark history.</p></div>
          <span class="badge" style="background:${data.enabled ? '#dcfce7' : '#f1f5f9'};color:${data.enabled ? '#166534' : '#475569'}">${data.enabled ? 'Enabled' : 'Paused'}</span>
        </div>
        <form id="call-webhook-form" style="margin-top:20px">
          <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><input type="checkbox" name="enabled" ${data.enabled ? 'checked' : ''}> Receive Callyzer calls</label>
          <label for="call-webhook-url" style="display:block;margin-bottom:6px;font-weight:600">Webhook URL</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input id="call-webhook-url" class="form-control" readonly value="${escapeHtml(data.url)}" style="flex:1;min-width:220px">
            <button type="button" class="btn btn-outlined" id="copy-call-webhook">Copy URL</button>
          </div>
          <p style="font-size:13px;color:#64748b;margin:10px 0 18px">Paste this URL in Callyzer and leave Secret blank. Add the portal user ID as an employee tag. Call dates and times are shown as supplied by Callyzer; portal timezone: ${escapeHtml(data.timeZone)}.</p>
          <button type="submit" class="btn btn-primary">Save webhook</button>
        </form>
      </div>
      <details class="card" style="padding:20px;margin-bottom:20px">
        <summary style="cursor:pointer;font-weight:600">User IDs for employee tags</summary>
        <p style="color:#64748b;font-size:13px;margin:12px 0">Use one user ID tag per employee, for example C6F91250-022A-4162-9196-44866796D14C. The id=USER_ID format also works. Other employee tags can stay.</p>
        <div class="table-wrap"><table><thead><tr><th>User</th><th>Employee tag</th></tr></thead><tbody>
          ${(data.users || []).map(user => `<tr><td>${escapeHtml(user.name || user.id)}</td><td><input class="form-control" readonly value="${escapeHtml(user.id)}" aria-label="User ID for ${escapeHtml(user.name || user.id)}" onclick="this.select()" style="min-width:290px"></td></tr>`).join('') || '<tr><td colspan="2">No active users.</td></tr>'}
        </tbody></table></div>
      </details>
      <div class="card" style="padding:20px">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h3>Recent deliveries</h3><button type="button" class="btn btn-outlined btn-sm" id="refresh-call-webhooks">Refresh</button></div>
        <p style="font-size:13px;color:#64748b;margin:10px 0 16px">Latest 30 deliveries. Calls match Phone or Alternate No. Fix unmatched numbers or user tags in the source, then resend those calls.</p>
        ${_callWebhookDeliveryHtml(data.deliveries || [])}
      </div>`;
    el('copy-call-webhook').onclick = async () => {
      const input = el('call-webhook-url');
      try { await navigator.clipboard.writeText(input.value); toast('Webhook URL copied'); }
      catch (_) { input.focus(); input.select(); toast('Select and copy the webhook URL', 'info'); }
    };
    el('refresh-call-webhooks').onclick = () => loadWebhooks();
    el('call-webhook-form').onsubmit = async event => {
      event.preventDefault();
      const button = event.target.querySelector('[type=submit]');
      const enabled = event.target.elements.enabled.checked;
      setButtonLoading(button);
      try {
        await api.saveCallWebhook({ enabled });
        toast(enabled ? 'Webhook enabled' : 'Webhook paused');
        if (App.currentPage === 'webhooks') await loadWebhooks();
      } catch (error) { toast(error.message || 'Unable to save webhook', 'error'); }
      finally { resetButtonLoading(button); }
    };
    renderIcons(container);
  } catch (error) {
    if (App.currentPage === 'webhooks') container.innerHTML = `<div class="card" style="padding:24px">${escapeHtml(error.message || 'Unable to load webhooks')}<button class="btn btn-outlined" onclick="loadWebhooks()" style="margin-left:12px">Retry</button></div>`;
  }
}

function _callWebhookDeliveryHtml(rows) {
  if (!rows.length) return '<p style="color:#64748b;padding:20px 0">No deliveries yet. Enable the webhook and send calls from Callyzer.</p>';
  return `<div class="table-wrap"><table><thead><tr><th>Received</th><th>Calls</th><th>Added</th><th>Updated</th><th>Duplicates</th><th>Needs attention</th></tr></thead><tbody>${rows.map(row => {
    const problems = [['unmatched','No matching lead'],['ambiguous','Multiple or conflicting matches'],['invalidUser','Missing, unknown or multiple user tags'],['invalid','Invalid call data']].filter(([key]) => row[key]).map(([key,label]) => `${label}: ${Number(row[key])}`).join(' · ');
    return `<tr><td>${escapeHtml(row.receivedAt)}</td><td>${Number(row.total || 0)}</td><td>${Number(row.added || 0)}</td><td>${Number(row.updated || 0)}</td><td>${Number(row.duplicate || 0)}</td><td>${escapeHtml(row.code || problems || 'None')}${row.issues && row.issues.length ? `<details><summary style="cursor:pointer;margin-top:5px">Call IDs</summary>${row.issues.map(issue => `<div style="font-size:12px;overflow-wrap:anywhere">${escapeHtml(issue.status)}: ${escapeHtml(issue.callId || '(missing ID)')}</div>`).join('')}</details>` : ''}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function _callRemarkHtml(row) {
  const remark = `<div class="fu-discussion" title="${escapeHtml(row['Remark'] || '')}"${row['Call ID'] ? ' style="white-space:pre-wrap;max-height:none"' : ''}>${escapeHtml(row['Remark'] || '-')}</div>`;
  if (!row['Call ID']) return remark;
  const seconds = Math.max(0, Number(row['Call Duration Seconds']) || 0);
  const duration = Math.floor(seconds / 60) + 'm ' + seconds % 60 + 's';
  let recording = '';
  try {
    const url = new URL(row['Call Recording URL']);
    if (url.protocol === 'https:' && !url.username && !url.password) recording = `<a href="${escapeHtml(url.href)}" target="_blank" rel="noopener noreferrer">Call recording</a>`;
  } catch (_) {}
  return remark + `<div style="font-size:12px;color:#64748b;margin-top:7px">${escapeHtml(duration)}${recording ? ' · ' + recording : ''}</div>`;
}
</script>
