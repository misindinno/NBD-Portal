<script>
let clientCallReportQuery = { page: 1 };
let clientCallReportRequest = 0;

async function loadClientCallReport() {
  const request = ++clientCallReportRequest;
  const box = el('content');
  box.innerHTML = skeletonPage('table');
  try {
    const data = await api._authedRead('apiGetClientCallReport', { ...clientCallReportQuery });
    if (request !== clientCallReportRequest || App.currentPage !== 'callreport') return;
    const q = data.filters;
    const option = (value, label, selected) => `<option value="${escapeHtml(value)}" ${value === selected ? 'selected' : ''}>${escapeHtml(label)}</option>`;
    const count = (value, color) => `<span style="color:${color};font-weight:700">● ${Number(value) || 0}</span>`;
    const totals = data.totals;
    box.innerHTML = `<div class="card" style="padding:24px;margin-bottom:16px">
      <h2>Client call totals</h2>
      <p>Completed follow-ups by client / lead. Dates use <strong>Done Date · Asia/Kolkata</strong>, including both selected days. Total calls = Call Connected + Not Picked. WhatsApp Chat is separate.</p>
      <form id="ccr-filters" style="display:flex;gap:12px;flex-wrap:wrap;align-items:end">
        <label>From<input class="form-control" type="date" name="from" value="${escapeHtml(q.from)}"></label>
        <label>To<input class="form-control" type="date" name="to" value="${escapeHtml(q.to)}"></label>
        <label>Client / lead ID<input class="form-control" name="search" maxlength="200" value="${escapeHtml(q.search)}" placeholder="Company or ID"></label>
        <label>Category<select class="form-control" name="category">${option('', 'All categories', q.category)}${data.categories.map(value => option(value, value, q.category)).join('')}${q.category && !data.categories.includes(q.category) ? option(q.category, q.category, q.category) : ''}</select></label>
        <label>Current lead status<select class="form-control" name="status">${['', 'Open', 'Won', 'Lost', 'Disqualified'].map(value => option(value, value || 'All statuses', q.status)).join('')}</select></label>
        <label>Records<select class="form-control" name="archive">${option('active', 'Active', q.archive)}${data.canArchive ? option('archived', 'Archived', q.archive) + option('all', 'Active and archived', q.archive) : ''}</select></label>
        <label>Completed by<select class="form-control" name="doneBy">${option('', 'All permitted users', q.doneBy)}${data.users.map(user => option(user.id, user.name + ' (' + user.id + ')', q.doneBy)).join('')}${q.doneBy && !data.users.some(user => user.id === q.doneBy) ? option(q.doneBy, q.doneBy, q.doneBy) : ''}</select></label>
        <button type="submit" class="btn btn-primary">Apply</button><button type="button" id="ccr-reset" class="btn btn-outlined">Reset</button>
      </form>
      <p style="display:flex;gap:24px;flex-wrap:wrap;margin-top:20px">
        <span>Call Connected ${count(totals.connected, '#15803d')}</span>
        <span>Not Picked ${count(totals.notPicked, '#b91c1c')}</span>
        <strong>Total calls: ${totals.totalCalls}</strong><span>WhatsApp Chat: ${totals.whatsapp}</span>
      </p>
      <p>Totals cover all filtered clients, including zero-activity clients. Category and status reflect the current lead record. Archived records require Archive permission.</p>
      ${(data.excluded.missingIds + data.excluded.conflictingIds + data.excluded.invalidDates) ? `<p role="status">Excluded history: ${data.excluded.missingIds} without a History ID; ${data.excluded.conflictingIds} conflicting IDs; ${data.excluded.invalidDates} with missing/invalid completion dates.</p>` : ''}
    </div>
    <div class="card" style="padding:20px">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><p>${data.total} clients / leads · Page ${data.page}</p><button id="ccr-export" class="btn btn-outlined">Export filtered CSV</button></div>
      <div class="table-wrap"><table><thead><tr><th>Client / lead</th><th>Lead ID</th><th>Category</th><th>Current status</th><th>Call Connected</th><th>Not Picked</th><th>Total calls</th><th>WhatsApp Chat</th></tr></thead>
      <tbody>${data.items.map(row => `<tr><td>${escapeHtml(row.company || '(Unnamed)')}</td><td>${escapeHtml(row.leadId)}</td><td>${escapeHtml(row.category)}</td><td>${escapeHtml(row.status)}${row.archived ? ' · Archived' : ''}</td><td>${count(row.connected, '#15803d')}</td><td>${count(row.notPicked, '#b91c1c')}</td><td><strong>${row.totalCalls}</strong></td><td>${row.whatsapp}</td></tr>`).join('') || '<tr><td colspan="8">No clients match these filters. Totals are zero.</td></tr>'}</tbody>
      <tfoot><tr><th colspan="4">All filtered clients</th><th>${totals.connected}</th><th>${totals.notPicked}</th><th>${totals.totalCalls}</th><th>${totals.whatsapp}</th></tr></tfoot></table></div>
      <div style="display:flex;gap:12px;margin-top:16px"><button id="ccr-prev" class="btn btn-outlined" ${data.page <= 1 ? 'disabled' : ''}>Previous</button><button id="ccr-next" class="btn btn-outlined" ${data.page * data.pageSize >= data.total ? 'disabled' : ''}>Next</button></div>
    </div>`;
    el('ccr-filters').onsubmit = event => {
      event.preventDefault();
      clientCallReportQuery = Object.fromEntries(new FormData(event.currentTarget).entries());
      clientCallReportQuery.page = 1;
      void loadClientCallReport();
    };
    el('ccr-reset').onclick = () => { clientCallReportQuery = { page: 1 }; void loadClientCallReport(); };
    el('ccr-prev').onclick = () => { clientCallReportQuery.page = data.page - 1; void loadClientCallReport(); };
    el('ccr-next').onclick = () => { clientCallReportQuery.page = data.page + 1; void loadClientCallReport(); };
    // Export applied filters, not pending inputs or just the visible page.
    el('ccr-export').onclick = async event => {
      const button = event.currentTarget;
      button.disabled = true;
      try {
        const exported = await api._authedRead('apiExportClientCallReport', { ...q });
        const url = URL.createObjectURL(new Blob(['\uFEFF', exported.csv], { type: 'text/csv;charset=utf-8' }));
        const anchor = document.createElement('a');
        anchor.href = url; anchor.download = exported.filename;
        document.body.appendChild(anchor); anchor.click(); anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) { toast(error.message, 'error'); }
      finally { button.disabled = false; }
    };
  } catch (error) {
    if (request !== clientCallReportRequest || App.currentPage !== 'callreport') return;
    box.innerHTML = `<div class="card" style="padding:24px"><p role="alert">${escapeHtml(error.message)}</p><button id="ccr-retry" class="btn btn-outlined">Retry</button> <button id="ccr-clear-error" class="btn btn-outlined">Reset filters</button></div>`;
    el('ccr-retry').onclick = () => void loadClientCallReport();
    el('ccr-clear-error').onclick = () => { clientCallReportQuery = { page: 1 }; void loadClientCallReport(); };
  }
}
</script>
