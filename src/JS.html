<script>
window.addEventListener('DOMContentLoaded', function startPortalFromDomReady() {
  const diagnostics = window.PortalDiagnostics;
  if (diagnostics) diagnostics.phase('dom.ready', 'complete', { readyState: document.readyState });
  Promise.resolve()
    .then(() => init())
    .catch(error => {
      if (diagnostics) diagnostics.failStartup('Portal initialization could not run.', error);
      else throw error;
    });
});
</script>
