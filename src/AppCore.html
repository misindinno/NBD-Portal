<script>
// ─── Global App (thin wrapper over Store) ────────────────────────────────────
const App = {
  get user()              { return Store.getState().user; },
  get config()            { return Store.getState().config; },
  get currentPage()       { return Store.getState().currentPage; },
  get navigationSummary() { return Store.getState().navigationSummary || {}; }
};

const AuthToken = {
  get() {
    let token = '';
    try { token = sessionStorage.getItem('nbd_token') || ''; } catch (e) {}
    if (token) return token;
    try {
      token = localStorage.getItem('nbd_token') || '';
      if (token) sessionStorage.setItem('nbd_token', token);
      localStorage.removeItem('nbd_token');
    } catch (e) {}
    return token;
  },
  set(token) {
    try { sessionStorage.setItem('nbd_token', String(token || '')); } catch (e) {}
    try { localStorage.removeItem('nbd_token'); } catch (e) {}
  },
  clear() {
    try { sessionStorage.removeItem('nbd_token'); } catch (e) {}
    try { localStorage.removeItem('nbd_token'); } catch (e) {}
  }
};

// ─── AppLookup — centralised ID → label resolver ─────────────────────────────
const AppLookup = (() => {
  let _u = {};
  let _s = {};

  return {
    rebuild() {
      const cfg = App.config || {};
      _u = cfg.userNameMap || {};
      _s = (cfg.allStages || cfg.stages || []).reduce((m, s) => {
        const id = s['Stage ID'];
        if (id) m[id] = {
          name:  s['Stage Name']  || id,
          color: s['Color']       || '#9E9E9E',
          order: Number(s['Stage Order']) || 0
        };
        return m;
      }, {});
    },
    userName(id) {
      if (!id) return '—';
      const raw = String(id);
      const hit = _u[raw] || _u[raw.trim().toLowerCase()];
      if (hit) return hit;
      return raw.includes('@') ? raw : '—';
    },
    stageName(id)  { if (!id) return '—'; return _s[id]?.name  || String(id); },
    stageColor(id) { if (!id) return '#9E9E9E'; return safeColor(_s[id]?.color, '#9E9E9E'); },
    stageObj(id)   { return id ? (_s[id] || null) : null; }
  };
})();

// ─── Auth ─────────────────────────────────────────────────────────────────────
async function fetchCurrentUser() {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(res => {
        if (!res) return reject(new Error('Server returned null. Push the latest code, redeploy the web app, and check Apps Script executions for the server error.'));
        if (res.success) resolve(res.data);
        else reject(new Error(res.error || 'ACCESS_DENIED'));
      })
      .withFailureHandler(err => reject(new Error(err.message || String(err))))
      .apiGetCurrentUser();
  });
}

// ─── API ──────────────────────────────────────────────────────────────────────
const api = {
  _read(fn, ...args) {
    const diagnostics = window.PortalDiagnostics;
    const rpcId = diagnostics ? diagnostics.rpcStart(fn) : '';

    return new Promise((resolve, reject) => {
      let settled = false;
      const rejectWithDiagnostics = error => {
        if (settled) return;
        settled = true;
        if (diagnostics) {
          diagnostics.rpcFailure(rpcId, {
            operation: fn,
            message: error.message,
            code: error.code || 'RPC_ERROR',
            requestId: error.requestId || '',
            meta: error.meta || {}
          });
        }
        reject(error);
      };
      const createRpcError = (message, envelope, source) => {
        const error = new Error(message);
        error.operation = fn;
        error.code = envelope && envelope.code || source && source.code || 'RPC_ERROR';
        error.meta = envelope && envelope.meta || source && source.meta || {};
        error.requestId = error.meta.requestId || envelope && envelope.requestId || source && source.requestId || '';
        if (envelope && envelope.details !== undefined) error.details = envelope.details;
        return error;
      };

      try {
        google.script.run
          .withSuccessHandler(res => {
            if (!res) {
              rejectWithDiagnostics(createRpcError(
                `${fn} returned null. Push the latest code, redeploy the web app, and check Apps Script executions for the server error.`,
                { code: 'EMPTY_RESPONSE', meta: {} }
              ));
              return;
            }
            if (!res.success) {
              rejectWithDiagnostics(createRpcError(`${fn}: ${res.error || 'Server request failed.'}`, res));
              return;
            }
            if (settled) return;
            settled = true;
            if (diagnostics) {
              diagnostics.rpcSuccess(rpcId, {
                operation: fn,
                requestId: res.meta && res.meta.requestId || '',
                meta: res.meta || {}
              });
            }
            resolve(res.data);
          })
          .withFailureHandler(source => {
            const message = source && source.message || String(source || 'Unknown transport failure');
            rejectWithDiagnostics(createRpcError(`${fn} failed: ${message}`, null, source));
          })[fn](...args);
      } catch (source) {
        const message = source && source.message || String(source || 'Unknown browser failure');
        rejectWithDiagnostics(createRpcError(`${fn} failed before dispatch: ${message}`, null, source));
      }
    });
  },
  _token()              { return AuthToken.get(); },
  _authedRead(fn, ...args) { return api._read(fn, api._token(), ...args); },

  // ── Session auth ──────────────────────────────────────────────────────────
  diagnosticPing:      ()      => api._read('apiDiagnosticPing'),
  getDiagnosticSnapshot: ()    => api._authedRead('apiGetDiagnosticSnapshot'),

  login:               (e, p)  => api._read('apiLogin', e, p),
  loginWithGoogle:     (t)     => api._read('apiLoginWithGoogle', t),
  bootstrapWithToken:  (t)     => api._read('apiBootstrapWithToken', t),
  bootstrapData:       (t)     => api._read('apiBootstrapData', t),
  logout:              (t)     => api._read('apiLogout', t),

  // ── Reads ─────────────────────────────────────────────────────────────────
  getDataStamps:       ()      => api._authedRead('apiGetDataStamps'),
  getAppConfig:        ()      => api._authedRead('apiGetAppConfig'),
  getAllStages:         ()      => api._authedRead('apiGetAllStages'),
  getAllConfigs:        ()      => api._authedRead('apiGetAllConfigs'),
  getAllFieldConfigs:   (s)     => api._authedRead('apiGetAllFieldConfigs', s),
  getLeads:            ()      => api._authedRead('apiGetLeads'),
  getLeadsPage:        (q)     => api._authedRead('apiGetLeadsPage', q || {}),
  getNavigationSummary: ()     => api._authedRead('apiGetNavigationSummary'),
  globalSearch:         (q)     => api._authedRead('apiGlobalSearch', q || ''),
  getLead:             (id)    => api._authedRead('apiGetLead', id),
  getLeadFieldValues:  (id)    => api._authedRead('apiGetLeadFieldValues', id),
  getVisits:           ()      => api._authedRead('apiGetVisits'),
  saveVisit:           (p)     => api._authedRead('apiSaveVisit', p || {}),
  updateVisit:         (p)     => api._authedRead('apiUpdateVisit', p || {}),
  deleteVisit:         (id)    => api._authedRead('apiDeleteVisit', id || ''),
  saveLead:            (p)     => api._authedRead('apiSaveLead', p || {}),
  saveLeadStageFields: (p)     => api._authedRead('apiSaveLeadStageFields', p || {}),
  deleteLead:          (id)    => api._authedRead('apiDeleteLead', id || ''),
  getArchiveData:      ()      => api._authedRead('apiGetArchiveData'),
  getArchivePage:      (q)     => api._authedRead('apiGetArchivePage', q || {}),
  getArchiveSuggestions: ()    => api._authedRead('apiGetArchiveSuggestions'),
  getLostArchiveLeads: ()      => api._authedRead('apiGetLostArchiveLeads'),
  archiveLead:         (p)     => api._authedRead('apiArchiveLead', p || {}),
  archiveLeads:        (p)     => api._authedRead('apiArchiveLeads', p || {}),
  restoreArchivedLead: (id)    => api._authedRead('apiRestoreArchivedLead', id || ''),
  updateLeadStage:     (p)     => api._authedRead('apiUpdateLeadStage', p || {}),
  moveLeadStageWithFields: (p) => api._authedRead('apiMoveLeadStageWithFields', p || {}),
  getFollowups:        (f)     => api._authedRead('apiGetFollowups', f),
  getFollowupHistory:  (f)     => api._authedRead('apiGetFollowupHistory', f),
  getFollowupPageSnapshot: (o)  => api._authedRead('apiGetFollowupPageSnapshot', o || {}),
  getFollowupsPage:    (q)     => api._authedRead('apiGetFollowupsPage', q || {}),
  saveFollowupDirect:  (p)     => api._authedRead('apiSaveFollowupDirect', p || {}),
  markFollowupDoneDirect: (id, p) => api._authedRead('apiMarkFollowupDoneDirect', id, p || {}),
  getLeadActivityLogs: (f)     => api._authedRead('apiGetLeadActivityLogs', f),
  getTodayActivitySnapshot: ()  => api._authedRead('apiGetTodayActivitySnapshot'),
  runSheetsApiSampleWrite: (p) => api._authedRead('apiRunSheetsApiSampleWrite', p || {}),
  getFollowupLeads:    ()      => api._authedRead('apiGetFollowupLeads'),
  getFollowupFormData: ()      => api._authedRead('apiGetFollowupFormData'),
  getUsers:            ()      => api._authedRead('apiGetUsers'),
  getNbdAssignableUsers: ()    => api._authedRead('apiGetNbdAssignableUsers'),
  checkNbdDuplicate:   (id)   => api._authedRead('apiCheckNbdDuplicate', id),
  getNbdPushContext:   (id)   => api._authedRead('apiGetNbdPushContext', id),
  pushLeadToNbd:       (p)    => api._authedRead('apiPushLeadToNbd', p || {}),
  getBulkConfig:       ()      => api._authedRead('apiGetBulkConfig'),
  validateBulkRows:    (rows, mode)  => api._authedRead('apiValidateBulkRows', rows, mode || 'create'),
  saveBulkRows:        (rows, mode)  => api._authedRead('apiSaveBulkRows', rows, mode || 'create'),
  createBulkFollowupOnlyRow: (row, rowNumber) => api._authedRead('apiCreateBulkFollowupOnlyRow', row, rowNumber),
  createErrorCsv:      (rows)  => api._authedRead('apiCreateErrorCsv', rows),

  // ── Admin ─────────────────────────────────────────────────────────────────
  updatePermissions: ()                      => api._authedRead('apiUpdatePermissions'),
  savePortalSettings: (p)                    => api._authedRead('apiSavePortalSettings', p || {}),
  addConfig: (p)                             => api._authedRead('apiAddConfig', p || {}),
  updateConfigStatus: (p)                    => api._authedRead('apiUpdateConfigStatus', p || {}),
  saveStage: (p)                             => api._authedRead('apiSaveStage', p || {}),
  reorderStages: (ids)                       => api._authedRead('apiReorderStages', ids || []),
  saveFieldConfig: (p)                       => api._authedRead('apiSaveFieldConfig', p || {}),
  saveUser: (p)                              => api._authedRead('apiSaveUser', p || {}),
};
</script>
