<style>
.td-group-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #e5e7eb}.td-group-tools select{max-width:100%;min-width:180px}.td-group-row th{background:#eef2ff;padding:12px;text-align:left;white-space:normal}.td-group-row span{font-weight:400;margin-left:12px}.td-group-summary{color:#64748b;font-size:12px}.td-group-row button{border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%;overflow-wrap:anywhere}
</style>
<script>
// ─── Today's Activity Page ────────────────────────────────────────────────────

let _todayCharts = {};
let _todayFiltersOpen = false;
let _todayCardFilter = '';
let _todayDensity = (typeof localStorage !== 'undefined' && localStorage.getItem('_todayDensity')) || 'compact';
let _todaySnapshotRequest = 0;
let _todayViewFilters = {};

function _todayCaptureView() {
  ['td-from','td-to','td-user','td-type','td-group'].forEach(id => {
    if (el(id)) _todayViewFilters[id] = el(id).value;
  });
  return { ..._todayViewFilters };
}

// ISO instants use the portal's calendar day; Sheet date strings are already local.
function _todayActivityDay(value) {
  const text = String(value || '');
  if (/T.*(?:Z|[+-]\d{2}:?\d{2})$/i.test(text)) {
    const date = new Date(text);
    if (!Number.isFinite(date.getTime())) return '';
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit' }).formatToParts(date);
    const part = type => parts.find(p => p.type === type).value;
    return part('year') + '-' + part('month') + '-' + part('day');
  }
  return _fmtDate(value || '');
}

function _todayStatusRows(logs, status) {
  const leads = new Map();
  logs.forEach(row => {
    const action = String(row['Action Type'] || '').toLowerCase();
    const field = String(row['Field Name'] || row.Field || '').toLowerCase();
    const id = String(row['Lead ID'] || '');
    if (!id || !(action.includes('stage') || action.includes('status') || field.includes('status')) ||
      _todayStatusValue(row) !== status || _todayNormalizeStatus(row['Old Value']) === status) return;
    const old = leads.get(id);
    if (!old || String(row['Created At']) > String(old['Created At'])) leads.set(id, row);
  });
  return [...leads.values()];
}

function _todayGroupFields() {
  const fields = [{key:'agent',label:'Agent'},{key:'day',label:'Activity date'}];
  const safe = key => key && !key.startsWith('_') && !/password|token|secret|authorization|hash/i.test(key) && !['__proto__','constructor','prototype'].includes(key);
  for (const [source, rows, config] of [
    ['activity',[...AppCache.getRows('followupHistory'),...AppCache.getRows('activityLogs'),...AppCache.getRows('followups')],App.config.followupFields || []],
    ['lead',AppCache.getRows('leads'),App.config.leadFields || []]
  ]) {
    const hidden = new Set(config.filter(f => f['Is Visible'] === false || f['Is Visible'] === 'FALSE').map(f => f['Column Key']));
    const names = new Map(config.map(f => [f['Column Key'], f['Field Name']]));
    const keys = new Set(rows.flatMap(row => Object.keys(row).filter(key => row[key] == null || typeof row[key] !== 'object')));
    [...keys].filter(key => safe(key) && !hidden.has(key)).sort().forEach(key => fields.push({key:source + ':' + key,label:(source === 'lead' ? 'Lead · ' : 'Activity · ') + (names.get(key) || key)}));
  }
  return fields;
}

function _todayGroupRows(rows, field, leadMap, userMap) {
  if (!field) return [{label:'',rows}];
  const groups = new Map();
  rows.forEach(row => {
    let value;
    if (field === 'agent') { const id = row['Created By'] || row['Done By'] || ''; value = userMap[id] || id; }
    else if (field === 'day') value = _todayActivityDay(row['Created At'] || row['Done Date']);
    else {
      const split = field.indexOf(':'), source = field.slice(0, split), key = field.slice(split + 1);
      const object = source === 'lead' ? leadMap[row['Lead ID']] || {} : row;
      value = Object.prototype.hasOwnProperty.call(object,key) ? object[key] : '';
      if (['Assigned To','Created By','Done By','Updated By'].includes(key)) value = userMap[value] || value;
      if (['Stage ID','Updated Stage ID'].includes(key)) value = AppLookup.stageName(value) || value;
    }
    const empty = value == null || String(value).trim() === '';
    const label = empty ? '(Not set)' : String(value);
    const key = JSON.stringify([empty,label]);
    if (!groups.has(key)) groups.set(key,{label,rows:[]});
    groups.get(key).rows.push(row);
  });
  return [...groups.values()].sort((a,b) => a.label.localeCompare(b.label,undefined,{numeric:true}));
}

function _todayCardClick(key) {
  _todayCardFilter = (_todayCardFilter === key) ? '' : key;
  _todayApply();
  const scroll = document.querySelector('#today-page .fu-table-scroll') || document.querySelector('#today-page');
  if (scroll && _todayCardFilter) {
    const wl = el('td-worklist');
    if (wl) wl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
window._todayCardClick = _todayCardClick;

async function loadToday(prefetched) {
  const request = ++_todaySnapshotRequest;
  _todayCaptureView();
  if (!el('today-wrap')) el('content').innerHTML = `<div id="today-wrap">${window.__PAGE_PREVIEW_READY ? '' : skeletonPage('today')}</div>`;

  // First load right after bootstrap: leads + follow-ups are already cached. Paint
  // immediately from them, then fetch only history + activity logs in the background
  // — avoids a redundant second full snapshot of leads/follow-ups on initial load.
  if (!(typeof PortalReadCache !== 'undefined' && PortalReadCache.enabled()) && window._todayBootstrapReuse && AppCache.isLoaded('leads') && AppCache.isLoaded('followups')) {
    window._todayBootstrapReuse = false;
    if (App.currentPage === 'today') _renderToday();
    const need = [];
    if (!AppCache.isLoaded('followupHistory')) need.push(_ensureCached('followupHistory', () => api.getFollowupHistory({})));
    if (!AppCache.isLoaded('activityLogs'))    need.push(_ensureCached('activityLogs',    () => api.getLeadActivityLogs({})));
    if (need.length) {
      try { await Promise.all(need); } catch (e) {}
      if (App.currentPage === 'today') _renderToday();
    }
    return;
  }

  // Normal open / manual refresh: always fetch a fresh snapshot.
  try {
    const snapshot = prefetched || await pagePreviewRead('apiGetTodayActivitySnapshot', [], data => loadToday(data), { current: () => request === _todaySnapshotRequest });
    if (request !== _todaySnapshotRequest || App.currentPage !== 'today') return;
    AppCache.setRows('leads', snapshot.leads || []);
    AppCache.setRows('followups', snapshot.followups || []);
    AppCache.setRows('followupHistory', snapshot.followupHistory || []);
    AppCache.setRows('activityLogs', snapshot.activityLogs || []);
    if (App.currentPage !== 'today') return;
    _renderToday();
    return;
  } catch (e) {
    if (request !== _todaySnapshotRequest || App.currentPage !== 'today') return;
    if (!AuthToken.get()) return;
    if (typeof PortalReadCache !== 'undefined' && PortalReadCache.enabled()) {
      AppCache.clear();
      el('content').innerHTML = '<p role="alert">Could not verify Today: ' + escapeHtml(e.message || String(e)) + '</p>';
      return;
    }
    console.warn('[Today] Sheets API snapshot failed; falling back to standard cache loads.', e);
  }

  const loads = [];
  if (!AppCache.isLoaded('followupHistory')) loads.push(_ensureCached('followupHistory', () => api.getFollowupHistory({})));
  if (!AppCache.isLoaded('activityLogs'))   loads.push(_ensureCached('activityLogs',   () => api.getLeadActivityLogs({})));
  if (!AppCache.isLoaded('leads'))          loads.push(_ensureCached('leads',           () => api.getLeads()));
  if (!AppCache.isLoaded('followups'))      loads.push(_ensureCached('followups',       () => api.getFollowups({})));
  if (loads.length) await Promise.all(loads);

  if (App.currentPage !== 'today') return;
  _renderToday();
}

function _renderToday() {
  const wrap = el('today-wrap');
  // Bail silently if the user already navigated away (DOM was replaced
  // by another page mid-flight). Prevents "Cannot set innerHTML on null".
  if (!wrap) return;
  const savedFilters = _todayCaptureView();
  const groupLabel = el('td-group')?.selectedOptions?.[0]?.textContent;
  const isAdminOrManager = ['ADMIN', 'MANAGER'].includes(App.user.role);
  const users = App.config.users || [];

  wrap.innerHTML = `
    <div class="fu-page td-page fu-density-${_todayDensity}" id="today-page">
      <div class="fu-topbar">
        <div class="fu-topbar-left">
          <div class="fu-hero-icon" style="background:linear-gradient(135deg,#EEF2FF,#C7D2FE);color:#4338CA">${icon('activity', 16)}</div>
          <div class="fu-topbar-titles">
            <div class="fu-hero-title">Today's Activity</div>
            <div class="fu-hero-sub">Live view of follow-ups done, stage moves, and new leads added.</div>
          </div>
        </div>
        <div class="fu-topbar-right">
          <button class="btn btn-outlined btn-sm fu-topbar-btn" onclick="loadToday()" title="Refresh">${icon('refresh-cw', 13)}<span class="fu-btn-text"> Refresh</span></button>
        </div>
      </div>

      <div id="td-cards" class="fu-kpis"></div>

      <div class="fu-tabs" id="td-tabs">
        <div class="fu-tabs-left" id="td-range-tabs"></div>
        <div class="fu-tabs-right">
          <div class="td-rate-pills" id="td-rate-pills"></div>
          <button class="fu-filter-toggle ${_todayFiltersOpen ? 'open' : ''}" id="td-filter-toggle" onclick="_todayToggleFilters()">
            ${icon('sliders-horizontal', 14)} <span>Filters</span>
            ${icon(_todayFiltersOpen ? 'chevron-up' : 'chevron-down', 13)}
          </button>
        </div>
      </div>

      <div class="fu-filter-bar" id="td-filter-bar" style="display:${_todayFiltersOpen ? 'block' : 'none'}">
        <div class="fu-filter-card-grid">
          <label class="fu-filter"><span>From</span><input type="date" id="td-from" onchange="_todaySetRange('custom')"></label>
          <label class="fu-filter"><span>To</span><input type="date" id="td-to" onchange="_todaySetRange('custom')"></label>
          ${isAdminOrManager ? `<label class="fu-filter"><span>User</span><select id="td-user" onchange="_todayApply()">
            <option value="">All Users</option>
            ${users.map(u => `<option value="${escapeHtml(u.id)}">${escapeHtml(u.name)}</option>`).join('')}
          </select></label>` : ''}
          <label class="fu-filter"><span>Type</span><select id="td-type" onchange="_todayApply()">
            <option value="">All Types</option>
            <option>Call</option><option>WhatsApp</option><option>Visit</option>
            <option>Email</option><option>Payment</option>
          </select></label>
          <button class="btn btn-outlined btn-sm fu-filter-clear-all" onclick="_todayClearFilters()">${icon('x', 13)} Clear</button>
        </div>
      </div>

      <div id="fu-body">
        <div class="td-charts">
          <div class="td-chart-box">
            <div class="td-chart-title">${icon('bar-chart-3', 13)} By Type</div>
            <div id="td-chart-type" class="td-chart-svg"></div>
          </div>
          <div class="td-chart-box">
            <div class="td-chart-title">${icon('trending-up', 13)} Daily Trend <span id="td-trend-range" style="color:#918fa5;font-weight:600"></span></div>
            <div id="td-chart-trend" class="td-chart-svg"></div>
          </div>
          <div class="td-chart-box">
            <div class="td-chart-title">${icon('pie-chart', 13)} Contact Modes</div>
            <div id="td-chart-outcome" class="td-chart-svg"></div>
          </div>
        </div>

        <div class="fu-worklist-card fu-density-${_todayDensity}" id="td-worklist">
          <div class="fu-worklist-head">
            <div class="fu-worklist-head-left">
              <div class="fu-worklist-title">Activity Feed <span class="fu-worklist-count" id="td-row-count">0</span></div>
              <div id="td-card-filter-chip"></div>
            </div>
            <div class="fu-worklist-tools">
              <div class="fu-density-toggle" role="group" aria-label="Row density">
                <button class="${_todayDensity === 'comfortable' ? 'active' : ''}" title="Comfortable" onclick="_todaySetDensity('comfortable')">${icon('rows-3', 12)}</button>
                <button class="${_todayDensity === 'compact' ? 'active' : ''}" title="Compact" onclick="_todaySetDensity('compact')">${icon('list', 12)}</button>
                <button class="${_todayDensity === 'ultra' ? 'active' : ''}" title="Ultra Compact" onclick="_todaySetDensity('ultra')">${icon('menu', 12)}</button>
              </div>
            </div>
          </div>
          <div class="td-group-tools"><label for="td-group">Group by</label><select id="td-group" class="form-control" onchange="_todayApply()"><option value="">No grouping</option>${_todayGroupFields().map(field => `<option value="${escapeHtml(field.key)}">${escapeHtml(field.label)}</option>`).join('')}</select><span id="td-group-summary" class="td-group-summary" role="status"></span></div>
          <div class="fu-table-scroll">
            <table class="fu-table">
              <thead><tr>
                <th>Done At</th><th>Agent</th><th>Company</th><th>Lead Source</th><th>Planned</th>
                <th>Contact Mode</th><th>Remark</th><th>Next Planned</th>
              </tr></thead>
              <tbody id="td-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>`;

  renderIcons();
  Object.entries(savedFilters).forEach(([id,value]) => {
    const input = el(id);
    if (!input) return;
    // An empty refresh can have no field keys. Keep the grouping selection so
    // the next successful load uses the same view instead of silently resetting.
    if (id === 'td-group' && value && !Array.from(input.options).some(option => option.value === value)) {
      input.add(new Option(groupLabel || value, value));
    }
    input.value = value;
  });
  _todayRenderRangeTabs(window._todayRange || 'today');
  _todayApply();
}

function _todayRenderRangeTabs(active) {
  const tabs = [
    ['today', 'Today', 'calendar-days'],
    ['yesterday', 'Yesterday', 'calendar-minus'],
    ['7d', 'Last 7 Days', 'calendar-range'],
    ['30d', 'This Month', 'calendar'],
    ['custom', 'Custom', 'sliders-horizontal']
  ];
  const wrap = el('td-range-tabs');
  if (!wrap) return;
  wrap.innerHTML = tabs.map(([id, label, ic]) => `
    <button class="fu-tab ${active === id ? 'active' : ''}" data-range="${id}" onclick="_todaySetRange('${id}')">
      ${icon(ic, 14)} <span>${label}</span>
    </button>`).join('');
  renderIcons(wrap);
}

function _todaySetRange(range) {
  window._todayRange = range;
  _todayRenderRangeTabs(range);
  // open the filter card automatically when custom is chosen
  if (range === 'custom' && !_todayFiltersOpen) _todayToggleFilters();
  _todayApply();
}

function _todayToggleFilters() {
  _todayFiltersOpen = !_todayFiltersOpen;
  const bar = el('td-filter-bar');
  const toggle = el('td-filter-toggle');
  if (bar) bar.style.display = _todayFiltersOpen ? 'block' : 'none';
  if (toggle) { toggle.classList.toggle('open', _todayFiltersOpen); renderIcons(toggle); }
}

function _todayClearFilters() {
  const u = el('td-user'); if (u) u.value = '';
  const t = el('td-type'); if (t) t.value = '';
  const f = el('td-from'); if (f) f.value = '';
  const to = el('td-to'); if (to) to.value = '';
  const group = el('td-group'); if (group) group.value = '';
  _todayCardFilter = '';
  window._todayRange = 'today';
  _todayRenderRangeTabs('today');
  _todayApply();
}

function _todaySetDensity(value) {
  _todayDensity = ['comfortable','compact','ultra'].includes(value) ? value : 'compact';
  try { localStorage.setItem('_todayDensity', _todayDensity); } catch (e) {}
  const page = el('today-page');
  const worklist = el('td-worklist');
  [page, worklist].forEach(node => {
    if (!node) return;
    node.classList.remove('fu-density-comfortable','fu-density-compact','fu-density-ultra');
    node.classList.add('fu-density-' + _todayDensity);
  });
  _todayApply();
}

function _todayStatusValue(row) {
  return _todayNormalizeStatus(row?.['New Value'] || row?.['Status After'] || row?.['New Status'] || row?.['Lead Status'] || row?.['Status'] || '');
}

function _todayNormalizeStatus(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  const stageStatus = _todayLeadStatusForStage(raw);
  if (stageStatus) return stageStatus;
  const lower = raw.toLowerCase();
  if (lower.includes('disqualif')) return 'Disqualified';
  if (lower.includes('lost')) return 'Lost';
  if (lower.includes('won') || lower.includes('qualified')) return 'Won';
  if (lower === 'open') return 'Open';
  if (lower === 'hold') return 'Hold';
  return raw;
}

function _todayLeadStatusForStage(stageIdOrName) {
  const value = String(stageIdOrName || '').trim();
  if (!value) return '';
  const stageList = [...(App.config.stages || []), ...(App.config.allStages || [])];
  const stage = stageList.find(s =>
    String(s['Stage ID'] || '') === value || String(s['Stage Name'] || '').trim().toLowerCase() === value.toLowerCase()
  );
  if (!stage) return '';
  const outcome = String(stage['Stage Outcome'] || '').trim().toLowerCase();
  const name = String(stage['Stage Name'] || '').trim().toLowerCase();
  if (outcome.includes('disqualif') || name.includes('disqualif')) return 'Disqualified';
  if (outcome === 'lost' || name.includes('lost')) return 'Lost';
  if (outcome === 'won' || name.includes('qualified') || name.includes('won')) return 'Won';
  const isFinal = stage['Is Final Stage'] === true || stage['Is Final Stage'] === 'TRUE';
  return isFinal ? 'Won' : '';
}

function _todayEscapeAttr(value) {
  return escapeHtml(String(value || '')).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function _todayDateRange() {
  const range = window._todayRange || 'today';
  const todayStr = localDateInputValue();
  let from, to;
  if (range === 'today') {
    from = to = todayStr;
  } else if (range === 'yesterday') {
    const d = new Date(); d.setDate(d.getDate() - 1);
    from = to = localDateInputValue(d);
  } else if (range === '7d') {
    const d = new Date(); d.setDate(d.getDate() - 6);
    from = localDateInputValue(d); to = todayStr;
  } else if (range === '30d') {
    const d = new Date(); d.setDate(1);
    from = localDateInputValue(d); to = todayStr;
  } else {
    from = el('td-from')?.value || todayStr;
    to   = el('td-to')?.value   || todayStr;
  }
  return { from, to };
}

// Returns a matcher that accepts a stored user identifier (id, email, or name)
// and reports whether it belongs to the selected user — so the User filter works
// regardless of which identifier the sheet happens to store.
function _todayUserMatcher(userFilter) {
  if (!userFilter) return function() { return true; };
  const u = (App.config.users || []).find(function(x) { return String(x.id) === String(userFilter); }) || {};
  const keys = {};
  [userFilter, u.id, u.email, u.name].forEach(function(k) { if (k) keys[String(k)] = true; });
  return function(v) { return !!keys[String(v == null ? '' : v)]; };
}

function _todayApply() {
  // Bail early if the Today page is no longer in the DOM (user navigated away
  // while async work was still in flight) — prevents null.innerHTML crashes.
  if (!el('today-page')) return;
  _todayCaptureView();
  const { from, to } = _todayDateRange();
  const userFilter = el('td-user')?.value || '';
  const typeFilter = el('td-type')?.value || '';

  const userMap = Object.create(null);
  (App.config.users || []).forEach(u => {
    if (u.id)    userMap[u.id]    = u.name;
    if (u.email) userMap[u.email] = u.name;
  });
  const leadMap  = AppCache.getRows('leads').reduce((m, l) => { m[l['Lead ID']] = l; return m; }, Object.create(null));
  const matchUser = _todayUserMatcher(userFilter);
  const _rowUser = r => matchUser(r['Done By']) || matchUser(r['Created By']) || matchUser(leadMap[r['Lead ID']] && leadMap[r['Lead ID']]['Assigned To']);

  let history = AppCache.getRows('followupHistory').filter(r => {
    const d = _todayActivityDay(r['Created At'] || r['Done Date'] || '');
    return d >= from && d <= to;
  });
  if (userFilter) history = history.filter(_rowUser);
  if (typeFilter) history = history.filter(r => r['Follow-up Type'] === typeFilter);

  let actLogs = AppCache.getRows('activityLogs').filter(r => {
    const d = _todayActivityDay(r['Created At'] || '');
    return d >= from && d <= to;
  });
  if (userFilter) actLogs = actLogs.filter(r => matchUser(r['Created By']) || matchUser(leadMap[r['Lead ID']] && leadMap[r['Lead ID']]['Assigned To']));

  let newLeads = AppCache.getRows('leads').filter(r => {
    const d = _todayActivityDay(r['Created At'] || '');
    return d >= from && d <= to;
  });
  if (userFilter) newLeads = newLeads.filter(r => matchUser(r['Assigned To']) || matchUser(r['Created By']));

  const MISSED_MODES = new Set(['Not Picked']);
  const activeHistory  = history.filter(r => !MISSED_MODES.has(r['Contact Mode'] || ''));

  const callsDone  = activeHistory.filter(r => r['Contact Mode'] === 'Call Connected' || r['Follow-up Type'] === 'Call').length;
  const visitsDone = activeHistory.filter(r => r['Follow-up Type'] === 'Visit').length;
  const waDone     = activeHistory.filter(r => r['Contact Mode'] === 'WhatsApp Chat' || r['Follow-up Type'] === 'WhatsApp').length;
  const productiveHistory = history.filter(r => String(r['Was Productive'] || '').trim().toLowerCase() === 'yes');
  const nonProductiveHistory = history.filter(r => String(r['Was Productive'] || '').trim().toLowerCase() === 'no');
  const wonRows = _todayStatusRows(actLogs, 'Won');
  const lostRows = _todayStatusRows(actLogs, 'Lost');
  const disqualifiedRows = _todayStatusRows(actLogs, 'Disqualified');

  // ── Pending Follow-ups: overdue + today open follow-ups + leads with no follow-up ──
  const _todayStr = localDateInputValue();
  const _toDateStr = (v) => {
    if (!v) return '';
    if (typeof _fmtDate === 'function') return _fmtDate(v);
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    return String(v).slice(0, 10);
  };
  const _isClosedFu = r => String(r['Status'] || '').toLowerCase() === 'closed' || !!r['Done Date'] || !!r['Outcome'];
  const _planned = r => _toDateStr(r['Next Follow-up Date'] || r['Next Planned Date']);
  const allFollowups = AppCache.getRows('followups') || [];
  const openFu = allFollowups.filter(r =>
    !_isClosedFu(r) && String(r['Follow-up Type'] || '').toLowerCase() !== 'stage change' && !!_planned(r)
  );
  const pendingFu = openFu.filter(r => { const d = _planned(r); return d && d <= _todayStr; });
  if (userFilter) {
    // Scope pending follow-ups to selected user when set
    var pendingFuFiltered = pendingFu.filter(r =>
      matchUser(r['Created By']) || matchUser(r['Done By']) ||
      matchUser(leadMap[r['Lead ID']] && leadMap[r['Lead ID']]['Assigned To'])
    );
  } else { var pendingFuFiltered = pendingFu; }
  const _fuLeadIds = new Set(
    allFollowups.map(r => r['Lead ID'])
      .concat((AppCache.getRows('followupHistory') || []).map(r => r['Lead ID']))
      .filter(Boolean)
  );
  const leadsNoFu = AppCache.getRows('leads').filter(l =>
    String(l['Lead Status'] || 'Open').toLowerCase() === 'open' &&
    !(l['NBD Lead ID'] || l['Pushed To NBD At']) &&
    !_fuLeadIds.has(l['Lead ID']) &&
    (!userFilter || matchUser(l['Assigned To']) || matchUser(l['Created By']))
  );
  const pendingCount = pendingFuFiltered.length + leadsNoFu.length;

  const coreCards = [
    { key: 'pending',   label: 'Pending Follow-up', value: pendingCount,       sub: 'overdue + today + new', icon: 'alert-circle', cls: 'warning' },
    { key: 'connected', label: 'Follow-ups Done', value: activeHistory.length, sub: 'connected',     icon: 'check-circle-2', cls: 'success' },
    { key: 'calls', label: 'Calls', value: callsDone, sub: 'connected', icon: 'phone-call', cls: 'purple' },
    { key: 'wa', label: 'WhatsApp', value: waDone, sub: 'chats', icon: 'message-circle', cls: 'success' },
    { key: 'visits', label: 'Visits', value: visitsDone, sub: 'follow-up visits', icon: 'map-pin', cls: 'blue' },
    { key: 'newleads', label: 'New Leads', value: newLeads.length, sub: 'created in selected period', icon: 'user-plus', cls: 'neutral' },
    { key: 'productive', label: 'Productive', value: productiveHistory.length, sub: 'marked yes', icon: 'thumbs-up', cls: 'success' },
    { key: 'nonproductive', label: 'Not Productive', value: nonProductiveHistory.length, sub: 'marked no', icon: 'thumbs-down', cls: 'danger' },
    { key: 'won', label: 'Won', value: wonRows.length, sub: 'unique leads won in period', icon: 'trophy', cls: 'success' },
    { key: 'lost', label: 'Lost', value: lostRows.length, sub: 'unique leads lost in period', icon: 'x-circle', cls: 'danger' },
    { key: 'disqualified', label: 'Disqualified', value: disqualifiedRows.length, sub: 'unique leads disqualified in period', icon: 'ban', cls: 'neutral' }
  ];
  const _todayRates = (typeof computeCallRates === 'function') ? computeCallRates(history) : { connectionRate: 0, conversionRate: 0, connects: 0, conversions: 0 };
  const ratePillsEl = el('td-rate-pills');
  if (ratePillsEl) {
    ratePillsEl.innerHTML = `
      <span class="td-rate-pill td-rate-pill-blue" title="${escapeHtml(_todayRates.connects || 0)} connected calls in selected range">
        ${icon('activity', 12)} Connection ${escapeHtml(_todayRates.connectionRate || 0)}%
      </span>
      <span class="td-rate-pill td-rate-pill-green" title="${escapeHtml(_todayRates.conversions || 0)} conversions in selected range">
        ${icon('trending-up', 12)} Conversion ${escapeHtml(_todayRates.conversionRate || 0)}%
      </span>`;
    renderIcons(ratePillsEl);
  }
  const cardHTML = k => `
    <button type="button" class="fu-kpi fu-kpi-${k.cls} ${_todayCardFilter === k.key ? 'active' : ''}" onclick="_todayCardClick('${_todayEscapeAttr(k.key)}')">
      <span class="fu-kpi-icon">${icon(k.icon, 17)}</span>
      <span class="fu-kpi-value">${escapeHtml(k.value)}</span>
      <span class="fu-kpi-label">${escapeHtml(k.label)}</span>
      <span class="fu-kpi-sub">${escapeHtml(k.sub)}</span>
    </button>`;
  const _cardsEl = el('td-cards');
  if (!_cardsEl) return;  // page was replaced while async work was in flight
  _cardsEl.innerHTML = coreCards.map(cardHTML).join('');
  renderIcons(_cardsEl);

  _todayDestroyCharts();
  _todayChartType(history);
  _todayChartTrend(from, to, userFilter, typeFilter, leadMap);
  _todayChartContactMode(history);

  const toLogRow = r => {
    const oldStage = r['Old Value'] ? (AppLookup.stageName(r['Old Value']) || r['Old Value']) : '';
    const newStage = r['New Value'] ? (AppLookup.stageName(r['New Value']) || r['New Value']) : '';
    const remark = r['Remark'] || (oldStage && newStage ? `${oldStage} → ${newStage}` : newStage || '');
    return {
      ...r,
      _isLog: true,
      'Created At': r['Created At'] || '',
      'Lead ID':    r['Lead ID'] || '',
      'Created By': r['Created By'] || '',
      'Follow-up Type': r['Action Type'] || 'Log',
      '_rawAction': r['Action Type'] || '',
      '_rawField': r['Field Name'] || r['Field'] || '',
      'New Value': r['New Value'] || '',
      'Status After': r['Status After'] || r['New Status'] || '',
      'Lead Status': r['Lead Status'] || '',
      'Status': r['Status'] || '',
      'Remark': remark,
      'Outcome': '',
      'Next Follow-up Date': ''
    };
  };
  const logRows = actLogs.map(toLogRow);

  const tbody = el('td-tbody');
  let allRows;
  switch (_todayCardFilter) {
    case 'connected': allRows = [...activeHistory]; break;
    case 'calls':     allRows = activeHistory.filter(r => r['Contact Mode'] === 'Call Connected' || r['Follow-up Type'] === 'Call'); break;
    case 'wa':        allRows = activeHistory.filter(r => r['Contact Mode'] === 'WhatsApp Chat' || r['Follow-up Type'] === 'WhatsApp'); break;
    case 'visits':    allRows = activeHistory.filter(r => r['Follow-up Type'] === 'Visit'); break;
    case 'won':       allRows = wonRows.map(toLogRow); break;
    case 'lost':      allRows = lostRows.map(toLogRow); break;
    case 'disqualified': allRows = disqualifiedRows.map(toLogRow); break;
    case 'productive': allRows = [...productiveHistory]; break;
    case 'nonproductive': allRows = [...nonProductiveHistory]; break;
    case 'newleads':
      allRows = newLeads.map(l => ({
        ...l,
        _isLog: true,
        'Created At': l['Created At'] || '',
        'Lead ID':    l['Lead ID'] || '',
        'Created By': l['Created By'] || l['Assigned To'] || '',
        'Follow-up Type': 'New Lead',
        'Remark': l['Client Description'] || `New lead created`,
        'Outcome': '', 'Next Follow-up Date': ''
      }));
      break;
    case 'pending':
      allRows = [
        ...pendingFuFiltered.map(r => {
          const planned = r['Next Follow-up Date'] || r['Next Planned Date'] || '';
          const pStr = _toDateStr(planned);
          const overdue = pStr && pStr < _todayStr;
          return {
            ...r,
            _isLog: true,
            'Created At': planned,
            'Lead ID': r['Lead ID'] || '',
            'Created By': leadMap[r['Lead ID']]?.['Assigned To'] || r['Created By'] || '',
            'Follow-up Type': overdue ? 'Overdue' : 'Due Today',
            'Remark': r['Discussion'] || r['Remark'] || 'Pending follow-up',
            'Follow-up Date': planned,
            'Planned Date': planned,
            'Outcome': '', 'Next Follow-up Date': ''
          };
        }),
        ...leadsNoFu.map(l => ({
          ...l,
          _isLog: true,
          'Created At': l['Created At'] || '',
          'Lead ID': l['Lead ID'] || '',
          'Created By': l['Assigned To'] || l['Created By'] || '',
          'Follow-up Type': 'No Follow-up Yet',
          'Remark': l['Client Description'] || 'New lead — needs first follow-up',
          'Outcome': '', 'Next Follow-up Date': ''
        }))
      ];
      break;
    default:
      allRows = [...history, ...logRows];
  }
  const _rcEl = el('td-row-count');
  if (_rcEl) _rcEl.textContent = allRows.length;

  const chipEl = el('td-card-filter-chip');
  if (chipEl) {
    if (_todayCardFilter) {
      const label = coreCards.find(card => card.key === _todayCardFilter)?.label || _todayCardFilter;
      chipEl.innerHTML = `<button class="fu-filter-chip" onclick="_todayCardClick('${_todayEscapeAttr(_todayCardFilter)}')">${escapeHtml(label)} ${icon('x', 11)}</button>`;
      renderIcons(chipEl);
    } else {
      chipEl.innerHTML = '';
    }
  }
  const groupField = el('td-group')?.value || '';
  const sorted = [...allRows].sort((a, b) => new Date(b['Created At'] || b['Done Date'] || 0) - new Date(a['Created At'] || a['Done Date'] || 0));
  const groups = _todayGroupRows(sorted, groupField, leadMap, userMap);
  const leadCount = rows => new Set(rows.map(row => String(row['Lead ID'] || '')).filter(Boolean)).size;
  const summary = el('td-group-summary');
  if (summary) summary.textContent = `${groupField ? groups.length + ' groups · ' : ''}${allRows.length} records · ${leadCount(allRows)} unique leads`;
  if (!tbody) return;
  if (!allRows.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty-table-cell">No activity found for the selected period.</td></tr>`;
  } else {
    const contactModeStyle = {
      'Call Connected': { bg:'#dcfce7', color:'#166534' },
      'WhatsApp Chat':  { bg:'#dbeafe', color:'#1D4ED8' },
      'Not Picked':     { bg:'#fee2e2', color:'#B91C1C' },
      'Stage Change':   { bg:'#f1f5f9', color:'#475569' },
      'Log':            { bg:'#f1f5f9', color:'#475569' }
    };
    const renderRow = r => {
      const lead      = leadMap[r['Lead ID']] || {};
      const company   = escapeHtml(lead['Company Name'] || r['Lead ID'] || '—');
      const city      = lead['City'] ? escapeHtml(lead['City']) : '';
      const createdBy = r['Created By'] || r['Done By'] || '';
      const agentName = userMap[createdBy] || createdBy || '—';
      const initial   = String(agentName).trim().charAt(0).toUpperCase() || '?';
      const isLog     = !!r._isLog;
      const isMissed  = MISSED_MODES.has(r['Contact Mode'] || '');
      const cm        = isLog ? (r['Follow-up Type'] || 'Log') : (r['Contact Mode'] || '');
      const cms       = contactModeStyle[cm] || { bg:'#f3f4f6', color:'#6b7280' };
      const contactBadge = cm
        ? `<span class="td-mode-badge" style="background:${cms.bg};color:${cms.color}">${escapeHtml(cm)}</span>`
        : `<span class="muted-text">—</span>`;
      const productiveValue = String(r['Was Productive'] || '').trim();
      const productiveBadge = productiveValue
        ? `<span class="td-mode-badge" style="margin-top:5px;background:${productiveValue === 'Yes' ? '#dcfce7' : '#fee2e2'};color:${productiveValue === 'Yes' ? '#166534' : '#991b1b'}">Productive: ${escapeHtml(productiveValue)}</span>`
        : '';
      const remark    = escapeHtml(r['Remark'] || r['Discussion'] || '—');
      const remarkRaw = (r['Remark'] || r['Discussion'] || '');
      const nextDate  = r['Next Follow-up Date'] || r['Next Planned Date'] || r['Next Date'] || '';
      const next      = nextDate ? formatDate(nextDate) : `<span class="muted-text">—</span>`;
      const doneAt    = formatDateTime(r['Created At'] || r['Done Date'] || '');
      const planned   = r['Follow-up Date'] || r['Planned Date'] || '';
      const plannedFmt = planned ? formatDate(planned) : `<span class="muted-text">—</span>`;
      const leadId    = r['Lead ID'] || '';
      const rowCls    = isMissed ? 'fu-row-overdue' : (isLog ? 'fu-row-done' : '');
      return `<tr class="fu-row ${rowCls}" ${leadId ? `data-lead-id="${_todayEscapeAttr(leadId)}" onclick="_todayOpenLead(this.dataset.leadId)" style="cursor:pointer"` : ''}>
        <td><div class="fu-date-sub" style="margin-top:0;font-weight:600;color:#1E293B">${doneAt}</div></td>
        <td><div class="fu-owner-cell"><span class="fu-owner-avatar">${escapeHtml(initial)}</span><span class="fu-owner-name">${escapeHtml(agentName)}</span></div></td>
        <td>
          <div class="fu-lead-title">${company}</div>
          ${city ? `<div class="fu-lead-sub">${icon('map-pin', 12)} ${city}</div>` : ''}
        </td>
        <td>${escapeHtml(lead['Source'] || '—')}</td>
        <td><div class="fu-date-sub">${plannedFmt}</div></td>
        <td><div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px">${contactBadge}${productiveBadge}</div></td>
        <td><div class="fu-discussion" title="${escapeHtml(remarkRaw)}">${remarkHtml(remarkRaw)}</div></td>
        <td><div class="fu-date-sub">${next}</div></td>
      </tr>`;
    };
    tbody.innerHTML = groups.map(group =>
      (groupField ? `<tr class="td-group-row"><th colspan="8" scope="rowgroup">${escapeHtml(group.label)}<span>${group.rows.length} records · ${leadCount(group.rows)} unique leads</span></th></tr>` : '') +
      group.rows.map(renderRow).join('')
    ).join('');
    renderIcons(tbody);
  }
  _todayAttachScrollCollapse();
}

function _todayAttachScrollCollapse() {
  const scroll = document.querySelector('#today-page .fu-table-scroll');
  const page = el('today-page');
  if (!scroll || !page || scroll._tdBound) return;
  scroll._tdBound = true;
  let ticking = false;
  scroll.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      page.classList.toggle('fu-scrolled', scroll.scrollTop > 20);
      ticking = false;
    });
  }, { passive: true });
}

function _todayOpenLead(leadId) {
  if (!leadId || typeof openLeadDetail !== 'function') return;
  openLeadDetail(leadId);
}

function _todayDestroyCharts() {
  _todayCharts = {};
  ['td-chart-type', 'td-chart-trend', 'td-chart-outcome'].forEach(id => {
    const c = el(id);
    if (c) c.innerHTML = '';
  });
}

// ── Today charts — hand-built SVG/CSS to match the Vela design ──────────────────
function _todayChartType(history) {
  const box = el('td-chart-type');
  if (!box) return;
  const types  = ['Call', 'WhatsApp', 'Visit', 'Email', 'Payment'];
  const counts = types.map(t => history.filter(r => r['Follow-up Type'] === t).length);
  const max = Math.max(1, ...counts);
  const topIdx = counts.indexOf(Math.max(...counts));
  const BRAND = brandPrimary(), BRAND2 = brandPrimaryLight();
  const bars = types.map((t, i) => {
    const c = counts[i];
    const h = c > 0 ? Math.max(6, Math.round(c / max * 100)) : 3;
    const bg = c > 0
      ? (i === topIdx ? `linear-gradient(180deg,${BRAND},${BRAND2})` : `linear-gradient(180deg,color-mix(in srgb,${BRAND} 45%,#fff),color-mix(in srgb,${BRAND2} 35%,#fff))`)
      : '#ecebf4';
    const shadow = (c > 0 && i === topIdx) ? `box-shadow:0 8px 18px -8px color-mix(in srgb,${BRAND} 55%,transparent);` : '';
    return '<div class="tdb-col"><span class="tdb-val">' + (c > 0 ? c : '') + '</span>' +
      '<div class="tdb-bar" style="height:' + h + '%;background:' + bg + ';' + shadow + '"></div></div>';
  }).join('');
  const lbls = types.map((t, i) =>
    '<span class="tdb-lbl' + (i === topIdx && counts[i] > 0 ? ' on' : '') + '">' + escapeHtml(t) + '</span>').join('');
  box.innerHTML = '<div class="tdb-bars">' + bars + '</div><div class="tdb-lbls">' + lbls + '</div>';
}

function _todayChartTrend(from, to, userFilter, typeFilter, leadMap) {
  const box = el('td-chart-trend');
  if (!box) return;
  const BRAND = brandPrimary(), BRAND2 = brandPrimaryLight();

  // Window = the selected range, but never shorter than 7 days, ending at the range
  // end — so a single-day range (Today/Yesterday) still shows a meaningful trend.
  const endStr   = to || localDateInputValue();
  const endD     = new Date(endStr + 'T00:00:00');
  let startD     = new Date((from || endStr) + 'T00:00:00');
  const minStart = new Date(endD); minStart.setDate(minStart.getDate() - 6);
  if (startD > minStart) startD = minStart;
  const days = [];
  for (let d = new Date(startD), g = 0; d <= endD && g < 370; d.setDate(d.getDate() + 1), g++) {
    days.push(localDateInputValue(d));
  }
  if (!days.length) days.push(endStr);

  // Count from followupHistory using the SAME user/type filter + date expression as
  // the rest of the page, so the line matches the cards and respects the filters.
  let rows = AppCache.getRows('followupHistory');
  const matchUser = _todayUserMatcher(userFilter);
  if (userFilter) rows = rows.filter(r => matchUser(r['Done By']) || matchUser(r['Created By']) || (leadMap && leadMap[r['Lead ID']] && matchUser(leadMap[r['Lead ID']]['Assigned To'])));
  if (typeFilter) rows = rows.filter(r => r['Follow-up Type'] === typeFilter);
  const byDay = {};
  rows.forEach(r => { const day = _todayActivityDay(r['Created At'] || r['Done Date'] || ''); if (day) byDay[day] = (byDay[day] || 0) + 1; });
  const counts = days.map(d => byDay[d] || 0);

  const sub = el('td-trend-range');
  if (sub) sub.textContent = '(' + days.length + (days.length === 1 ? ' day)' : ' days)');

  if (!counts.some(c => c > 0)) {
    box.innerHTML = '<div style="padding:46px 10px;text-align:center;color:#918fa5;font-size:13px">No follow-up activity in this range</div>';
    return;
  }

  const fmtLbl = ds => { const dt = new Date(ds + 'T00:00:00'); return dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); };
  const n = days.length;
  const left = 16, right = 684, top = 26, bot = 182;
  const max = Math.max(1, ...counts);
  const px = i => n === 1 ? (left + right) / 2 : Math.round((left + (i * (right - left)) / (n - 1)) * 10) / 10;
  const py = c => Math.round((bot - (c / max) * (bot - top)) * 10) / 10;
  const pts = counts.map((c, i) => [px(i), py(c)]);

  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
  const area = n > 1 ? line + ' L' + pts[n - 1][0] + ' ' + bot + ' L' + pts[0][0] + ' ' + bot + ' Z' : '';
  const dots = pts.map((p, i) =>
    '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="#fff" stroke="' + BRAND + '" stroke-width="2.5">' +
    '<title>' + escapeHtml(fmtLbl(days[i]) + ': ' + counts[i]) + '</title></circle>').join('');

  // Always-visible value labels for readable ranges; hover tooltips (above) cover the rest.
  const vals = n <= 12 ? pts.map((p, i) => counts[i] > 0
    ? '<span style="left:' + (p[0] / 700 * 100).toFixed(2) + '%;top:' + (p[1] / 210 * 100).toFixed(2) + '%">' + counts[i] + '</span>'
    : '').join('') : '';

  box.innerHTML =
    '<div class="tdt-plot">' +
      '<svg viewBox="0 0 700 210" width="100%" height="170" preserveAspectRatio="none" style="display:block;overflow:visible">' +
        '<defs>' +
          '<linearGradient id="ta-area" x1="0" y1="0" x2="0" y2="210" gradientUnits="userSpaceOnUse"><stop stop-color="' + BRAND + '" stop-opacity=".28"/><stop offset="1" stop-color="' + BRAND + '" stop-opacity="0"/></linearGradient>' +
          '<linearGradient id="ta-line" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="' + BRAND2 + '"/><stop offset="1" stop-color="' + BRAND + '"/></linearGradient>' +
        '</defs>' +
        '<line x1="16" y1="182" x2="684" y2="182" stroke="#f0eff6" stroke-width="1"/>' +
        '<line x1="16" y1="105" x2="684" y2="105" stroke="#f5f4fa" stroke-width="1"/>' +
        '<line x1="16" y1="28" x2="684" y2="28" stroke="#f5f4fa" stroke-width="1"/>' +
        (area ? '<path d="' + area + '" fill="url(#ta-area)"/>' : '') +
        (n > 1 ? '<path class="tdt-line" d="' + line + '" fill="none" stroke="url(#ta-line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' : '') +
        dots +
      '</svg>' +
      (vals ? '<div class="tdt-vals">' + vals + '</div>' : '') +
    '</div>' +
    '<div class="tdt-lbls">' + _todayTrendLabels(days, fmtLbl) + '</div>';

  // Draw-in animation on navigation / filter change. Use the path's real length
  // (getTotalLength) so the whole line always reveals, whatever the window size.
  // Skipped on the silent 15s background refresh so it doesn't keep replaying.
  if (!window._todayBgRender) {
    const lineEl = box.querySelector('.tdt-line');
    if (lineEl && lineEl.getTotalLength) {
      try {
        const len = lineEl.getTotalLength();
        lineEl.style.strokeDasharray = len + ' ' + len;
        lineEl.style.strokeDashoffset = String(len);
        lineEl.getBoundingClientRect(); // force reflow so the transition runs
        lineEl.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1)';
        lineEl.style.strokeDashoffset = '0';
      } catch (e) {}
    }
  }
}

function _todayTrendLabels(days, fmtLbl) {
  const n = days.length;
  if (n <= 1) return '<span>' + escapeHtml(fmtLbl(days[0])) + '</span>';
  const step = n <= 12 ? 1 : Math.ceil(n / 8);
  const out = [];
  for (let i = 0; i < n; i += step) out.push('<span>' + escapeHtml(fmtLbl(days[i])) + '</span>');
  if ((n - 1) % step !== 0) out.push('<span>' + escapeHtml(fmtLbl(days[n - 1])) + '</span>');
  return out.join('');
}

function _todayChartContactMode(history) {
  const box = el('td-chart-outcome');
  if (!box) return;
  const modeMap = {};
  history.forEach(r => { const m = r['Contact Mode'] || 'No Contact Mode'; modeMap[m] = (modeMap[m] || 0) + 1; });
  const entries = Object.entries(modeMap).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((s, e) => s + e[1], 0);
  if (!total) { box.innerHTML = '<div style="padding:40px;text-align:center;color:#918fa5;font-size:13px">No contact data yet</div>'; return; }
  const palette = ['#16a34a', '#ef4444', '#2563eb', brandPrimary(), '#d97706', '#0d9488', '#7c3aed', '#64748b'];
  const C = 2 * Math.PI * 54;
  let acc = 0;
  const segs = entries.map((e, i) => {
    const len = (e[1] / total) * C;
    const rot = -90 + (acc / total) * 360;
    acc += e[1];
    return '<circle cx="70" cy="70" r="54" fill="none" stroke="' + palette[i % palette.length] +
      '" stroke-width="20" stroke-dasharray="' + len.toFixed(1) + ' ' + (C - len).toFixed(1) +
      '" transform="rotate(' + rot.toFixed(1) + ' 70 70)"/>';
  }).join('');
  const legend = entries.map((e, i) => {
    const pct = Math.round(e[1] / total * 100);
    return '<div class="tdc-leg"><span class="tdc-dot" style="background:' + palette[i % palette.length] + '"></span>' +
      '<span class="tdc-lbl">' + escapeHtml(e[0]) + '</span><span class="tdc-pct">' + pct + '%</span></div>';
  }).join('');
  box.innerHTML =
    '<div class="tdc-wrap"><div class="tdc-ring">' +
      '<svg viewBox="0 0 140 140" width="150" height="150"><circle cx="70" cy="70" r="54" fill="none" stroke="#f0eff6" stroke-width="20"/>' + segs + '</svg>' +
      '<div class="tdc-center"><span class="tdc-total">' + total + '</span><span class="tdc-sub">logged</span></div>' +
    '</div><div class="tdc-legend">' + legend + '</div></div>';
}
</script>
