<style>
  .vf-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .vf-row2 { grid-template-columns: 1fr; } }
  .vf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .vf-table th { text-align: left; font-size: 11.5px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid #e6e8f0; white-space: nowrap; }
  .vf-table td { padding: 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; color: #0f172a; }
  .vf-table tr:last-child td { border-bottom: 0; }
  .vf-remark { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vf-row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 900px) { .vf-row3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .vf-row3 { grid-template-columns: 1fr; } }
</style>
<script>
let _vfState = { lead: null, leadId: '', editVisitId: '' };
let _vfVisits = null;
let _vfListState = { search: '', city: '', dateFrom: '', dateTo: '', page: 1, pageSize: 25 };

async function loadVisits() {
  const content = el('content');
  if (!content) return;
  _vfState = { lead: null, leadId: '', editVisitId: '' };
  _vfVisits = null;
  const kiosk = document.body.classList.contains('sff-kiosk');
  content.innerHTML = `
    <div class="sff-wrap"${kiosk ? '' : ' style="max-width:920px"'}>
      <div class="sff-header">
        <div class="sff-hero-ic">${icon('map-pin', 22)}</div>
        <div>
          <div class="sff-title">Client Visit Report</div>
          <div class="sff-sub">Pick a lead and record the visit details.</div>
        </div>
      </div>
      <div class="sff-card">
        <div class="sff-field">
          <label>Lead <span style="color:#ef4444">*</span></label>
          <div class="sff-picker">
            <input class="sff-input" id="vf-lead-search" type="text" autocomplete="off"
              placeholder="Search lead by company, contact, phone or city…"
              oninput="_vfFilterLeads(this.value)" onfocus="_vfFilterLeads(this.value)">
            <div class="sff-picker-list" id="vf-lead-list" style="display:none"></div>
          </div>
          <div class="sff-selected" id="vf-selected" style="display:none"></div>
        </div>
        <form id="vf-form" onsubmit="return false">
          <div class="vf-row2">
            <div class="sff-field">
              <label>DATE <span style="color:#ef4444">*</span></label>
              <input class="sff-input" type="date" name="DATE" value="${localDateInputValue()}" required>
            </div>
            <div class="sff-field">
              <label>CITY</label>
              <input class="sff-input" name="CITY" placeholder="City">
            </div>
          </div>
          <div class="vf-row3">
            <div class="sff-field"><label>ACCOMODATION TOUR</label><input class="sff-input" type="number" min="0" step="0.01" name="ACCOMODATION TOUR"></div>
            <div class="sff-field"><label>ACCOMODATION STAY</label><input class="sff-input" type="number" min="0" step="0.01" name="ACCOMODATION STAY"></div>
            <div class="sff-field"><label>AMOUNT</label><input class="sff-input" type="number" min="0" step="0.01" name="AMOUNT"></div>
            <div class="sff-field"><label>LEADS</label><input class="sff-input" type="number" min="0" step="1" name="LEADS"></div>
            <div class="sff-field"><label>source</label><input class="sff-input" name="source"></div>
            <div class="sff-field"><label>CONTACT NO.</label><input class="sff-input" name="CONTACT NO."></div>
            <div class="sff-field"><label>FSR</label><input class="sff-input" type="number" min="0" step="1" name="FSR"></div>
            <div class="sff-field"><label>SC</label><input class="sff-input" type="number" min="0" step="1" name="SC"></div>
            <div class="sff-field"><label>VISIT</label><input class="sff-input" type="number" min="0" step="1" name="VISIT"></div>
            <div class="sff-field"><label>designation</label><input class="sff-input" name="designation"></div>
            <div class="sff-field"><label>CONVERSION</label><input class="sff-input" type="number" min="0" step="1" name="CONVERSION"></div>
          </div>
          <div class="sff-field">
            <label>FEEDBACK</label>
            <textarea class="form-control" name="FEEDBACK" rows="3" placeholder="Visit feedback"></textarea>
          </div>
          <div class="sff-field">
            <label>FEEDBACK ATTACHEMT</label>
            <input class="form-control" type="file" name="FEEDBACK ATTACHEMT__file" data-file-key="FEEDBACK ATTACHEMT" data-max-mb="10" accept="image/*,application/pdf">
            <div style="font-size:11px;color:#9ca3af;margin-top:4px">Upload image or PDF, max 10 MB.</div>
          </div>
          <div class="sff-actions">
            <button type="button" class="btn btn-primary" id="vf-save" onclick="_vfSave()">${icon('save', 15)} Save Visit</button>
            <button type="button" class="btn btn-outlined" id="vf-cancel-edit" style="display:none" onclick="_vfCancelEdit()">Cancel Edit</button>
          </div>
        </form>
      </div>
      ${kiosk ? '' : `<div class="sff-card" style="margin-top:18px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <div>
            <div class="sff-title" style="font-size:16px">Visit Records</div>
            <div class="sff-sub" style="font-size:12px">Search, filter and export saved visits.</div>
          </div>
          <button type="button" class="btn btn-outlined btn-sm" onclick="_vfExportVisits()">${icon('download', 14)} Export CSV</button>
        </div>
        <div class="vf-row3" style="margin-bottom:12px">
          <input class="form-control" id="vf-filter-search" placeholder="Search company, city, feedback..." oninput="_vfSetFilter('search', this.value)">
          <input class="form-control" id="vf-filter-city" placeholder="City" oninput="_vfSetFilter('city', this.value)">
          <div class="vf-row2" style="gap:8px">
            <input class="form-control" id="vf-filter-from" type="date" onchange="_vfSetFilter('dateFrom', this.value)">
            <input class="form-control" id="vf-filter-to" type="date" onchange="_vfSetFilter('dateTo', this.value)">
          </div>
        </div>
        <div id="vf-list">
          <div class="sff-skel">
            <div class="skeleton-block" style="height:38px;border-radius:8px;margin-bottom:8px"></div>
            <div class="skeleton-block" style="height:38px;border-radius:8px;margin-bottom:8px"></div>
            <div class="skeleton-block" style="height:38px;border-radius:8px"></div>
          </div>
        </div>
      </div>`}
    </div>`;
  renderIcons(content);
  if (!window._vfOutsideBound) {
    window._vfOutsideBound = true;
    document.addEventListener('click', function (e) {
      const picker = document.querySelector('#vf-lead-search')?.closest('.sff-picker');
      const list = el('vf-lead-list');
      if (list && picker && !picker.contains(e.target)) list.style.display = 'none';
    }, true);
  }
  if (!kiosk) _vfLoadList();
}
window.loadVisits = loadVisits;

function _vfLeadRows() { try { return AppCache.getRows('leads') || []; } catch (e) { return []; } }

function _vfFilterLeads(q) {
  const list = el('vf-lead-list');
  if (!list) return;
  const query = String(q || '').trim().toLowerCase();
  let rows = _vfLeadRows().filter(l =>
    !(l['NBD Lead ID'] || l['Pushed To NBD At']) &&
    String(l['Is Archived']) !== 'true' && l['Is Archived'] !== true);
  if (query) {
    rows = rows.filter(l => [l['Company Name'], l['Contact Person'], l['Phone'], l['Alternate No'], l['City'], l['Client Description'], l['Lead ID']]
      .map(x => String(x || '').toLowerCase()).join(' ').includes(query));
  }
  rows = rows.slice(0, 50);
  list.innerHTML = rows.length
    ? rows.map(l => `<div class="sff-picker-item" onclick="_vfSelectLead('${escapeHtml(String(l['Lead ID'] || ''))}')">
        <div class="sff-pi-title">${escapeHtml(l['Company Name'] || l['Client Description'] || l['Lead ID'] || '—')}</div>
        <div class="sff-pi-sub">${escapeHtml([l['Contact Person'], l['City'], l['Phone']].filter(Boolean).join(' · ') || String(l['Lead ID'] || ''))}</div>
      </div>`).join('')
    : '<div class="sff-picker-empty">No matching leads</div>';
  list.style.display = 'block';
}
window._vfFilterLeads = _vfFilterLeads;

function _vfSelectLead(leadId) {
  const list = el('vf-lead-list'); if (list) list.style.display = 'none';
  const lead = _vfLeadRows().find(l => String(l['Lead ID']) === String(leadId)) || { 'Lead ID': leadId };
  _vfState.lead = lead;
  _vfState.leadId = String(leadId);
  const sel = el('vf-selected');
  if (sel) {
    sel.style.display = 'flex';
    sel.innerHTML = `<div>
        <div class="sff-pi-title">${escapeHtml(lead['Company Name'] || lead['Client Description'] || leadId)}</div>
        <div class="sff-pi-sub">${escapeHtml([lead['Contact Person'], lead['City'], lead['Phone']].filter(Boolean).join(' · '))}</div>
      </div>
      <button type="button" class="sff-selected-change" onclick="_vfClearLead()">Change</button>`;
  }
  const search = el('vf-lead-search'); if (search) search.style.display = 'none';
  _vfPrefillLeadFields(lead);
}
window._vfSelectLead = _vfSelectLead;

function _vfPrefillLeadFields(lead) {
  const form = el('vf-form');
  if (!form || !lead) return;
  const setIfEmpty = (name, value) => {
    const input = form.querySelector(`[name="${name}"]`);
    if (input && !input.value) input.value = value || '';
  };
  setIfEmpty('CITY', lead['City']);
  setIfEmpty('source', lead['Source']);
  setIfEmpty('CONTACT NO.', lead['Phone']);
}

function _vfClearLead() {
  _vfState.lead = null;
  _vfState.leadId = '';
  const sel = el('vf-selected'); if (sel) { sel.style.display = 'none'; sel.innerHTML = ''; }
  const search = el('vf-lead-search'); if (search) { search.style.display = ''; search.value = ''; search.focus(); }
}
window._vfClearLead = _vfClearLead;

async function _vfSave() {
  const lead = _vfState.lead;
  if (!lead) { toast('Select a lead first.', 'error'); return; }
  const form = el('vf-form');
  if (form && typeof form.reportValidity === 'function' && !form.reportValidity()) return;
  const btn = el('vf-save');
  setButtonLoading(btn, 'Saving…');
  try {
    const payload = await collectLeadFormPayload(form);
    payload['Lead ID'] = lead['Lead ID'];
    delete payload['Stage ID'];
    if (_vfState.editVisitId) {
      payload['Visit ID'] = _vfState.editVisitId;
      await api.updateVisit(payload);
      toast('Visit report updated!');
    } else {
      await api.saveVisit(payload);
      toast('Visit report saved!');
    }
    // Fresh form (and refreshed list) for the next entry.
    loadVisits();
  } catch (err) {
    toast(err && err.message || err, 'error');
  } finally {
    resetButtonLoading(btn);
  }
}
window._vfSave = _vfSave;

async function _vfLoadList() {
  const box = el('vf-list');
  if (!box) return;
  try {
    _vfVisits = (await api.getVisits()) || [];
  } catch (e) {
    if (el('vf-list')) el('vf-list').innerHTML = `<div class="sff-hint">Could not load visits: ${escapeHtml(e && e.message || e)}</div>`;
    return;
  }
  _vfRenderList();
}

function _vfRenderList() {
  const box = el('vf-list');
  if (!box) return;
  const allRows = _vfVisits || [];
  const rows = _vfFilteredVisits_();
  if (!allRows.length) { box.innerHTML = '<div class="sff-hint">No visits recorded yet.</div>'; return; }
  if (!rows.length) { box.innerHTML = '<div class="sff-hint">No visits match the selected filters.</div>'; return; }
  const leadMap = _vfLeadRows().reduce((m, l) => { m[l['Lead ID']] = l; return m; }, {});
  const nameOf = id => (App.config.userNameMap && App.config.userNameMap[id]) || id || '-';
  const pageSize = _vfListState.pageSize;
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (_vfListState.page > totalPages) _vfListState.page = totalPages;
  const start = (_vfListState.page - 1) * pageSize;
  const pageRows = rows.slice(start, start + pageSize);
  box.innerHTML = `<div style="overflow-x:auto"><table class="vf-table">
    <thead><tr><th>DATE</th><th>Company</th><th>CITY</th><th>AMOUNT</th><th>LEADS</th><th>CONVERSION</th><th>FEEDBACK</th><th>ATTACHMENT</th><th>By</th><th></th></tr></thead>
    <tbody>${pageRows.map(v => {
      const lead = leadMap[v['Lead ID']] || {};
      const feedback = v['FEEDBACK'] || v['Remarks'] || '';
      const attachment = String(v['FEEDBACK ATTACHEMT'] || '').trim();
      return `<tr>
        <td style="white-space:nowrap">${escapeHtml(_fmtDate(v['DATE'] || v['Visit Date']) || '-')}</td>
        <td>
          <div class="sff-pi-title">${escapeHtml(lead['Company Name'] || v['Lead ID'] || '-')}</div>
          <div class="sff-pi-sub">${escapeHtml([lead['Contact Person'], lead['City']].filter(Boolean).join(' | '))}</div>
        </td>
        <td style="white-space:nowrap">${escapeHtml(v['CITY'] || lead['City'] || '-')}</td>
        <td style="white-space:nowrap">${escapeHtml(v['AMOUNT'] || '-')}</td>
        <td style="white-space:nowrap">${escapeHtml(v['LEADS'] || '-')}</td>
        <td style="white-space:nowrap">${escapeHtml(v['CONVERSION'] || '-')}</td>
        <td><div class="vf-remark" title="${escapeHtml(feedback)}">${escapeHtml(feedback || '-')}</div></td>
        <td style="white-space:nowrap">${attachment ? `<a href="${escapeHtml(attachment)}" target="_blank" rel="noopener">Open</a>` : '-'}</td>
        <td style="white-space:nowrap">${escapeHtml(nameOf(v['Created By']))}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-outlined btn-sm" onclick="_vfEditVisit('${escapeHtml(String(v['Visit ID'] || ''))}')">${icon('pencil', 13)}</button>
          <button class="btn btn-outlined btn-sm" onclick="_vfDeleteVisit('${escapeHtml(String(v['Visit ID'] || ''))}')">${icon('trash-2', 13)}</button>
        </td>
      </tr>`;
    }).join('')}</tbody></table></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap">
      <div class="sff-hint">Showing ${start + 1}-${Math.min(start + pageSize, rows.length)} of ${rows.length} visit(s).</div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn btn-outlined btn-sm" ${_vfListState.page <= 1 ? 'disabled' : ''} onclick="_vfSetPage(${_vfListState.page - 1})">${icon('chevron-left', 14)} Prev</button>
        <span class="sff-hint">Page ${_vfListState.page} / ${totalPages}</span>
        <button class="btn btn-outlined btn-sm" ${_vfListState.page >= totalPages ? 'disabled' : ''} onclick="_vfSetPage(${_vfListState.page + 1})">Next ${icon('chevron-right', 14)}</button>
      </div>
    </div>`;
  renderIcons(box);
}

function _vfEditVisit(visitId) {
  const visit = (_vfVisits || []).find(v => String(v['Visit ID']) === String(visitId));
  if (!visit) { toast('Visit not found.', 'error'); return; }
  const lead = _vfLeadRows().find(l => String(l['Lead ID']) === String(visit['Lead ID'])) || { 'Lead ID': visit['Lead ID'] };
  _vfSelectLead(visit['Lead ID']);
  _vfState.editVisitId = String(visitId || '');
  const form = el('vf-form');
  if (!form) return;
  ['DATE','CITY','ACCOMODATION TOUR','ACCOMODATION STAY','AMOUNT','LEADS','source','CONTACT NO.','FSR','SC','VISIT','designation','CONVERSION','FEEDBACK','FEEDBACK ATTACHEMT'].forEach(name => {
    const input = form.querySelector(`[name="${name}"]`);
    if (input) input.value = visit[name] || '';
  });
  const fileInput = form.querySelector('[name="FEEDBACK ATTACHEMT__file"]');
  if (fileInput) fileInput.value = '';
  const saveBtn = el('vf-save');
  if (saveBtn) saveBtn.innerHTML = `${icon('save', 15)} Update Visit`;
  const cancelBtn = el('vf-cancel-edit');
  if (cancelBtn) cancelBtn.style.display = '';
  renderIcons(form);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window._vfEditVisit = _vfEditVisit;

function _vfCancelEdit() {
  loadVisits();
}
window._vfCancelEdit = _vfCancelEdit;

async function _vfDeleteVisit(visitId) {
  visitId = String(visitId || '').trim();
  if (!visitId) return;
  let ok = false;
  if (typeof Swal !== 'undefined') {
    const res = await Swal.fire({
      title: 'Delete visit?',
      text: 'This will remove the selected visit record.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Delete',
      confirmButtonColor: '#dc2626'
    });
    ok = res.isConfirmed;
  } else {
    ok = window.confirm('Delete this visit?');
  }
  if (!ok) return;
  try {
    await api.deleteVisit(visitId);
    _vfVisits = (_vfVisits || []).filter(v => String(v['Visit ID']) !== visitId);
    toast('Visit deleted.');
    _vfRenderList();
  } catch (err) {
    toast('Delete failed: ' + (err && err.message || err), 'error');
  }
}
window._vfDeleteVisit = _vfDeleteVisit;

function _vfFilteredVisits_() {
  const leadMap = _vfLeadRows().reduce((m, l) => { m[l['Lead ID']] = l; return m; }, {});
  const f = _vfListState;
  const q = String(f.search || '').trim().toLowerCase();
  const city = String(f.city || '').trim().toLowerCase();
  return (_vfVisits || []).filter(v => {
    const lead = leadMap[v['Lead ID']] || {};
    const visitDate = String(v['DATE'] || v['Visit Date'] || '').slice(0, 10);
    if (f.dateFrom && visitDate && visitDate < f.dateFrom) return false;
    if (f.dateTo && visitDate && visitDate > f.dateTo) return false;
    const rowCity = String(v['CITY'] || lead['City'] || '').toLowerCase();
    if (city && !rowCity.includes(city)) return false;
    if (!q) return true;
    return [
      v['Visit ID'], v['Lead ID'], v['DATE'], v['CITY'], v['source'], v['CONTACT NO.'],
      v['designation'], v['FEEDBACK'], lead['Company Name'], lead['Contact Person'], lead['City'], lead['Phone']
    ].map(x => String(x || '').toLowerCase()).join(' ').includes(q);
  });
}

function _vfSetFilter(key, value) {
  _vfListState[key] = value || '';
  _vfListState.page = 1;
  _vfRenderList();
}
window._vfSetFilter = _vfSetFilter;

function _vfSetPage(page) {
  _vfListState.page = Math.max(1, Number(page) || 1);
  _vfRenderList();
}
window._vfSetPage = _vfSetPage;

function _vfExportVisits() {
  const rows = _vfFilteredVisits_();
  if (!rows.length) { toast('No visits to export.', 'error'); return; }
  const leadMap = _vfLeadRows().reduce((m, l) => { m[l['Lead ID']] = l; return m; }, {});
  const headers = ['DATE','Company','Lead ID','CITY','ACCOMODATION TOUR','ACCOMODATION STAY','AMOUNT','LEADS','source','CONTACT NO.','FSR','SC','VISIT','designation','CONVERSION','FEEDBACK','FEEDBACK ATTACHEMT','Created By','Created At'];
  const csv = [headers].concat(rows.map(v => {
    const lead = leadMap[v['Lead ID']] || {};
    return [
      v['DATE'] || v['Visit Date'] || '',
      lead['Company Name'] || '',
      v['Lead ID'] || '',
      v['CITY'] || lead['City'] || '',
      v['ACCOMODATION TOUR'] || '',
      v['ACCOMODATION STAY'] || '',
      v['AMOUNT'] || '',
      v['LEADS'] || '',
      v['source'] || lead['Source'] || '',
      v['CONTACT NO.'] || lead['Phone'] || '',
      v['FSR'] || '',
      v['SC'] || '',
      v['VISIT'] || '',
      v['designation'] || '',
      v['CONVERSION'] || '',
      v['FEEDBACK'] || v['Remarks'] || '',
      v['FEEDBACK ATTACHEMT'] || '',
      (App.config.userNameMap && App.config.userNameMap[v['Created By']]) || v['Created By'] || '',
      v['Created At'] || ''
    ];
  })).map(row => row.map(_vfCsvCell_).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'visit-records.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
window._vfExportVisits = _vfExportVisits;

function _vfCsvCell_(value) {
  const text = String(value === undefined || value === null ? '' : value);
  return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}
</script>
