<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#faf7f9;color:#252332;font:15px system-ui,sans-serif}main{max-width:760px;margin:32px auto;padding:20px}section{background:#fff;border:1px solid #e7dfe5;border-radius:14px;padding:24px;margin:18px 0}label{display:block;margin:14px 0;font-weight:550}input,select,textarea,button{font:inherit}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #d9cfd6;border-radius:7px;margin-top:6px}button{padding:10px 16px;border-radius:7px;border:1px solid #cf2d80;background:#db2777;color:white;cursor:pointer}button.secondary{background:white;color:#a91a5c}button:disabled{opacity:.5;cursor:wait}.muted{color:#777}#message{white-space:pre-wrap}fieldset{border:0;margin:0;padding:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}[hidden]{display:none!important}.result{display:block;width:100%;text-align:left;margin:8px 0;background:white;color:#252332;border-color:#ddd}
</style></head><body><main><small>LQ CLIENT SUPPORT</small><h1>How can we help?</h1><p>Choose your company and send a question or order enquiry. No login is required.</p><div id="receipt" hidden></div><form id="form"><fieldset id="fields"><section><h2>1. Company details</h2><div id="existing"><label>Search company or city<input id="search" maxlength="100" placeholder="Enter at least 3 characters"></label><button type="button" id="find" class="secondary">Search</button><div id="results"></div><p id="selected" class="muted">Select your company from the search results.</p></div><div id="new-client" hidden><div class="grid"><label>Company name *<input name="companyName" maxlength="300"></label><label>Contact person *<input name="contact" maxlength="200"></label><label>Company phone<input name="clientPhone" type="tel" maxlength="40"></label><label>City *<input name="city" maxlength="120"></label><label>State<input name="state" maxlength="120"></label></div><label>Address<input name="address" maxlength="800"></label></div><button type="button" id="toggle" class="secondary">Company not listed? Add details</button></section><section><h2>2. Your contact details</h2><div class="grid"><label>Your name *<input name="requesterName" required minlength="2" maxlength="200" autocomplete="name"></label><label>Your phone (optional)<input name="requesterPhone" type="tel" maxlength="40" autocomplete="tel"></label></div><label>Email (optional)<input name="requesterEmail" type="email" maxlength="254" autocomplete="email"></label></section><section><h2>3. Your query</h2><label>Query type *<select name="kind"><option>GENERAL</option><option>ORDER</option><option>QUOTATION</option><option>PRODUCT</option><option>SERVICE</option><option>COMPLAINT</option></select></label><label>Subject *<input name="subject" required minlength="3" maxlength="200"></label><label>Details *<textarea name="message" required minlength="10" maxlength="5000" rows="6"></textarea></label><div hidden aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div></section><p id="message" role="status"></p><button type="submit">Send query</button><button type="button" class="secondary" id="new-request" hidden>Start a new submission</button></fieldset></form></main><script>
const $=id=>document.getElementById(id),form=$('form');let client=null,newClient=false,requestId='',busy=false,submitted=null;
function rpc(name,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(r=>{if(!r||!r.success)reject(new Error(r&&r.error||'Request could not be completed. Retry with the same details.'));else resolve(r.data);}).withFailureHandler(e=>reject(new Error(e.message||'Connection failed.')))[name](...args);});}
$('toggle').onclick=()=>{newClient=!newClient;client=null;$('existing').hidden=newClient;$('new-client').hidden=!newClient;$('toggle').textContent=newClient?'Search existing companies':'Company not listed? Add details';['companyName','contact','city'].forEach(k=>form.elements[k].required=newClient);};
$('find').onclick=async()=>{const q=$('search').value.trim();if(q.length<3){$('message').textContent='Enter at least 3 characters.';return;}$('find').disabled=true;try{const rows=await rpc('apiEcsPublicClients',q);$('results').replaceChildren();rows.forEach(r=>{const b=document.createElement('button');b.type='button';b.className='result';b.textContent=[r.name,r.city,r.state,r.sourceName,r.maskedPhone].filter(Boolean).join(' · ');b.onclick=()=>{client=r;$('selected').textContent=b.textContent;$('results').replaceChildren();};$('results').appendChild(b);});if(!rows.length)$('selected').textContent='No company found. You can add new company details.';}catch(e){$('message').textContent=e.message;}finally{$('find').disabled=false;}};
form.onsubmit=async e=>{e.preventDefault();if(busy)return;if(!newClient&&!client){$('message').textContent='Select your company first.';return;}const v=k=>String(form.elements[k].value||'').trim();if(!requestId)requestId=crypto.randomUUID();const payload={requestId,...(newClient?{clientDetails:{name:v('companyName'),contact:v('contact'),phone:v('clientPhone'),address:v('address'),city:v('city'),state:v('state')}}:{clientId:client.id}),requesterName:v('requesterName'),requesterPhone:v('requesterPhone'),requesterEmail:v('requesterEmail'),kind:v('kind'),subject:v('subject'),message:v('message'),website:v('website')};
 if(submitted&&submitted!==JSON.stringify(payload)){$('message').textContent='The previous submission is unconfirmed. Retry its original details, or start a new submission only after checking whether it was received.';$('new-request').hidden=false;return;}submitted=JSON.stringify(payload);busy=true;$('fields').disabled=true;$('message').textContent='Sending your query…';
 try{const receipt=await rpc('apiEcsSubmitPublic',payload);form.hidden=true;$('receipt').hidden=false;const section=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p'),b=document.createElement('button');h.textContent='Your query has been received';p.textContent='Reference: '+receipt.reference;b.textContent='Submit another query';b.onclick=()=>location.reload();section.append(h,p,b);$('receipt').replaceChildren(section);}catch(error){$('message').textContent=error.message;}finally{busy=false;$('fields').disabled=false;}};
$('new-request').onclick=()=>{requestId='';submitted=null;$('new-request').hidden=true;$('message').textContent='Ready for a new submission.';};
</script></body></html>
