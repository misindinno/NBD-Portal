// Pending commands are separate from server-confirmed read snapshots. Tokens are

    async enqueue(item) {

function createPortalSync({ storage, send, online = () => navigator.onLine, now = () => Date.now(), changed = () => {}, committed = async () => {}, confirmationWaitMs = 120000 }) {

            Promise.resolve().then(() => send(item, context)),

}

const PortalSync = createPortalSync({
  storage: createPortalOutbox(leadIndexedDb_()),
  send: async item => {
    if (item.action === 'apiClientFactoryVisitSave') {
      const result = await api._read(item.action, AuthToken.get(), ...item.args);
      return { state: 'committed', result };
    }
    const { id, action, args, bases, portal, user, scope } = item;
    return api._read('apiSyncPush', AuthToken.get(), { id, action, args, bases, portal, user, scope });
  },
  changed: () => { void renderPortalSyncStatus(); },
  committed: async () => {
    if (typeof PagePreview !== 'undefined') await PagePreview.invalidate();
    await LeadReadCache.invalidate(); await PortalReadCache.invalidate();
    if (typeof SheetMirror !== 'undefined') { SheetMirror.invalidate(); refreshSheetMirror(); }
    try { portalSyncChannel.postMessage('changed'); } catch (_) {}
    _leadCacheCheckedAt = 0; _portalCacheCheckedAt = 0;
  }
});
let portalSyncChannel;
try { portalSyncChannel = new BroadcastChannel('nbd-sync-changes'); portalSyncChannel.onmessage = () => {
  if (typeof PagePreview !== 'undefined') void PagePreview.invalidate();
  LeadReadCache.verifyNext(); PortalReadCache.verifyNext(); void renderPortalSyncStatus();
  if (typeof SheetMirror !== 'undefined') { SheetMirror.invalidate(); refreshSheetMirror(); }
}; } catch (_) {}
window.addEventListener('online', () => { void PortalSync.drain(); });
window.addEventListener('focus', () => { void PortalSync.drain(); });
setInterval(() => { if (!document.hidden) void PortalSync.drain().catch(() => {}); }, 5000);

let portalSyncStatusGeneration = 0;
async function renderPortalSyncStatus() {
  const generation = ++portalSyncStatusGeneration;
  let button = document.getElementById('portal-sync-status');
  const admin = App.user && App.user.role === 'ADMIN';
  if (!PortalSync.enabled() && !admin) { if (button) button.remove(); return; }
  if (!button) {
    button = document.createElement('button'); button.id = 'portal-sync-status'; button.className = 'btn btn-outlined';
    button.style.cssText = 'position:fixed;bottom:14px;right:100px;max-width:calc(100vw - 120px);z-index:1100;background:white';
    document.body.appendChild(button);
  }
  button.onclick = PortalSync.enabled() ? showPortalSyncQueue : setupPortalSync;
  if (!PortalSync.enabled()) { button.textContent = 'Set up Sheets sync'; return; }
  try {
    const rows = await PortalSync.list();
    if (generation !== portalSyncStatusGeneration) return;
    button.textContent = 'Pending changes: ' + rows.filter(row => !['committed','dismissed'].includes(row.state)).length;
  } catch (_) { if (generation === portalSyncStatusGeneration) button.textContent = 'Sync storage unavailable'; }
}
async function setupPortalSync() {
  const result = await Swal.fire({ title: 'Enable Sheets sync',
    text: 'Enable background sync and pending changes for this portal. Google Sheets remains the main data source. Pending changes stay on their original browser until synced. This adds an operation log to the workbook.',
    showCancelButton: true, confirmButtonText: 'Enable sync' });
  if (!result.isConfirmed) return;
  try { await api._read('apiSyncInitialize', AuthToken.get()); window.location.reload(); }
  catch (error) { toast(error.message, 'error'); }
}
async function showPortalSyncQueue() {
  const rows = (await PortalSync.list()).filter(row => row.state !== 'dismissed').sort((a,b) => b.createdAt - a.createdAt).slice(0,100);
  const wrap = document.createElement('div');
  const intro = document.createElement('p'); intro.textContent = 'Pending changes are stored on this device. Only Synced means the change is saved in Google Sheets. Keep this portal open to sync.'; wrap.appendChild(intro);
  rows.forEach(row => {
    const card = document.createElement('div'); card.style.cssText = 'text-align:left;padding:12px;border-bottom:1px solid #ddd';
    const title = document.createElement('strong'); title.textContent = row.action.replace(/^api/,'') + ' — ' + (row.state === 'committed' ? 'Synced' : row.state); card.appendChild(title);
    const detail = document.createElement('p'); detail.textContent = (row.message || '') + ' Reference: ' + row.id; card.appendChild(detail);
    if (['conflict','invalid'].includes(row.state)) {
      const payload = document.createElement('pre'); payload.textContent = JSON.stringify(row.args, null, 2); payload.style.cssText = 'max-height:180px;overflow:auto;white-space:pre-wrap'; card.appendChild(payload);
    }
    if (['retry','blocked','paused','conflict','invalid','committed'].includes(row.state)) {
      const button = document.createElement('button'); button.className = 'btn btn-outlined';
      const dismiss = ['conflict','invalid','committed'].includes(row.state) && !(row.state === 'invalid' && portalSyncSchemaIssue_(row));
      button.textContent = dismiss ? 'Dismiss' : 'Retry';
      button.onclick = async () => { try { await PortalSync[dismiss ? 'dismiss' : 'retry'](row.key); Swal.close(); await showPortalSyncQueue(); } catch (error) { toast(error.message, 'error'); } }; card.appendChild(button);
    }
    wrap.appendChild(card);
  });
  await Swal.fire({ title: 'Pending changes', html: wrap, width: 760, showConfirmButton: true, confirmButtonText: 'Close' });
}
