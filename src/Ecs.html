<script>
const EcsState={rows:[],activities:[],clients:[],options:null,search:'',status:'',kind:'',source:'',unlinked:false,page:1,selected:new Set(),active:'',dirty:false,loading:false,generation:0,ready:false,revision:''};
function ecsLabel(v){return String(v||'').toLowerCase().replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function ecsObjects(table){return table?table.rows.map(r=>Object.fromEntries(table.headers.map((h,i)=>[h,r.cells[i]]))):[];}
function ecsJson(value){try{return JSON.parse(value||'{}');}catch(_){return {};}}
async function ecsReadLocal(){
 const tables=await Promise.all(['ECS_QUERIES','ECS_ACTIVITIES','ECS_CLIENTS'].map(n=>SheetMirror.previewSheet(n)));
 if(!tables.every(t=>t&&t.exists))return false;
 EcsState.ready=true;EcsState.revision=JSON.stringify(tables.map(t=>t.rows));EcsState.rows=ecsObjects(tables[0]);EcsState.activities=ecsObjects(tables[1]);EcsState.clients=ecsObjects(tables[2]);return true;
}
function ecsDiscardDraft(){if(EcsState.dirty&&!confirm('Discard unsaved query changes?'))return false;EcsState.dirty=false;return true;}
async function loadEcs(){
 if(!ecsDiscardDraft())return;
 if(typeof ECS_ENABLED==='undefined'||!ECS_ENABLED)return;
 const generation=++EcsState.generation;EcsState.loading=true;
 try{
  const options=pagePreviewRead('apiEcsOptions',[],value=>{EcsState.options=value;if(App.currentPage==='ecs'&&EcsState.ready&&!EcsState.dirty)ecsRender();});
  const cached=await ecsReadLocal();EcsState.options=await options;
  if(App.currentPage!=='ecs'||generation!==EcsState.generation)return;
  if(cached)ecsRender();else el('content').innerHTML='<div class="card" style="padding:24px">Preparing ECS queries on this device…</div>';
  for(const name of ['ECS_QUERIES','ECS_ACTIVITIES','ECS_CLIENTS'])await SheetMirror.readSheet(name);
  if(!await ecsReadLocal())throw new Error('ECS tables are not initialized.');if(App.currentPage==='ecs'&&generation===EcsState.generation&&!EcsState.dirty)ecsRender();
 }catch(error){if(App.currentPage==='ecs'){if(EcsState.options&&EcsState.rows.length)toast(error.message,'error');else el('content').innerHTML=`<div class="card" style="padding:24px"><p>${escapeHtml(error.message)}</p><button class="btn btn-outlined" onclick="loadEcs()">Retry</button>${App.user.role==='ADMIN'?'<button class="btn btn-primary" onclick="ecsInitialize()">Initialize ECS</button>':''}</div>`;}}
 finally{EcsState.loading=false;}
}
async function ecsInitialize(){try{await api._read('apiEcsInitialize',AuthToken.get());SheetMirror.invalidate();await loadEcs();}catch(e){toast(e.message,'error');}}
let ecsMirrorTimer;
function ecsMirrorChanged(event){if(!event||!['ECS_QUERIES','ECS_ACTIVITIES','ECS_CLIENTS'].includes(event.name))return;clearTimeout(ecsMirrorTimer);ecsMirrorTimer=setTimeout(async()=>{if(App.currentPage!=='ecs'||EcsState.loading||EcsState.dirty)return;const revision=EcsState.revision;if(await ecsReadLocal()&&revision!==EcsState.revision)ecsRender();},250);}
function ecsFiltered(){const s=EcsState;return s.rows.filter(r=>(!s.status||r.status===s.status)&&(!s.kind||r.kind===s.kind)&&(!s.source||r.sourceKey===s.source)&&(!s.unlinked||!r.clientId)&&(!s.search||[r.companyName,r.subject,r.message,r.reference,r.requesterName,r.requesterPhone].join(' ').toLowerCase().includes(s.search.toLowerCase()))).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));}
function ecsOptionsHtml(values,current){return values.map(v=>`<option value="${escapeHtml(v)}" ${v===current?'selected':''}>${escapeHtml(ecsLabel(v))}</option>`).join('');}
function ecsRender(){
 if(App.currentPage!=='ecs'||!EcsState.options)return;
 const s=EcsState,o=s.options,all=ecsFiltered();s.page=Math.min(s.page,Math.max(1,Math.ceil(all.length/50)));const rows=all.slice((s.page-1)*50,s.page*50),sources=[...new Map(s.rows.map(r=>[r.sourceKey,r.sourceName])).entries()];
 el('content').innerHTML=`<div class="card" style="padding:20px;margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2>ECS Queries</h2><p>Client enquiries, assignments and follow-up notes.</p></div><div><a class="btn btn-primary" target="_blank" rel="noopener" href="${escapeHtml(o.url)}">Open public form</a> <button class="btn btn-outlined" id="ecs-copy-link">Copy form link</button>${o.canManage?` <button class="btn btn-outlined" id="ecs-toggle">${o.enabled?'Pause':'Enable'} form</button>`:''}</div></div><form id="ecs-filter" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><input class="form-control" name="search" placeholder="Search company, reference or query" value="${escapeHtml(s.search)}"><select class="form-control" name="status"><option value="">All statuses</option>${ecsOptionsHtml(o.statuses,s.status)}</select><select class="form-control" name="kind"><option value="">All query types</option>${ecsOptionsHtml(o.kinds,s.kind)}</select><select class="form-control" name="source"><option value="">All source portals</option>${sources.map(([key,name])=>`<option value="${escapeHtml(key)}" ${key===s.source?'selected':''}>${escapeHtml(name)}</option>`).join('')}</select><label><input type="checkbox" name="unlinked" ${s.unlinked?'checked':''}> New clients only</label><button class="btn btn-primary">Search</button><button type="button" class="btn btn-outlined" onclick="loadEcs()">Refresh</button></form></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px"><div class="card" style="padding:18px;min-width:0">${o.canEdit?`<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span>${s.selected.size} selected</span><select class="form-control" id="ecs-bulk-status">${ecsOptionsHtml(o.statuses,'IN_PROGRESS')}</select><button id="ecs-bulk" class="btn btn-outlined" ${s.selected.size?'':'disabled'}>Update selected</button></div>`:''}<div class="table-wrap"><table><thead><tr>${o.canEdit?'<th><input type="checkbox" id="ecs-all" aria-label="Select this page"></th>':''}<th>Client / query</th><th>Status</th><th>Assigned to</th><th>Received</th><th></th></tr></thead><tbody>${rows.map(r=>{const pushed=s.activities.filter(a=>a.queryId===r.id&&['PUSHED_AS_LEAD','EXISTING_LEAD_LINKED'].includes(a.action)).map(a=>ecsJson(a.details).portalName).filter(Boolean);return `<tr>${o.canEdit?`<td><input type="checkbox" data-ecs-select="${escapeHtml(r.id)}" ${s.selected.has(r.id)?'checked':''}></td>`:''}<td><strong>${escapeHtml(r.companyName)}</strong><br>${escapeHtml(r.subject)}<br><small>${escapeHtml(ecsLabel(r.kind))} · ${r.clientId?'Linked client':'New client'}${pushed.length?'<br>Pushed: '+escapeHtml([...new Set(pushed)].join(', ')):''}</small></td><td>${escapeHtml(ecsLabel(r.status))}</td><td>${escapeHtml(r.assignedTo||'Unassigned')}</td><td>${escapeHtml(String(r.createdAt).slice(0,10))}</td><td><button class="btn btn-outlined" data-ecs-open="${escapeHtml(r.id)}">View / manage</button></td></tr>`;}).join('')||'<tr><td colspan="6">No matching queries.</td></tr>'}</tbody></table></div><p>${all.length} queries · Page ${s.page}</p><button class="btn btn-outlined" id="ecs-prev" ${s.page<=1?'disabled':''}>Previous</button> <button class="btn btn-outlined" id="ecs-next" ${s.page*50>=all.length?'disabled':''}>Next</button></div><div id="ecs-detail"></div></div>`;
 el('ecs-filter').onsubmit=e=>{e.preventDefault();if(!ecsDiscardDraft())return;const f=e.target;s.search=f.search.value;s.status=f.status.value;s.kind=f.kind.value;s.source=f.source.value;s.unlinked=f.unlinked.checked;s.page=1;s.selected.clear();ecsRender();};
 el('ecs-copy-link').onclick=async()=>{try{await navigator.clipboard.writeText(o.url);toast('Form link copied');}catch(_){prompt('Copy form link',o.url);}};
 if(el('ecs-toggle'))el('ecs-toggle').onclick=async()=>{try{await api._read('apiEcsSetPublicEnabled',AuthToken.get(),!o.enabled);await PagePreview.invalidate();await loadEcs();}catch(e){toast(e.message,'error');}};
 el('ecs-prev').onclick=()=>{if(!ecsDiscardDraft())return;s.page--;ecsRender();};el('ecs-next').onclick=()=>{if(!ecsDiscardDraft())return;s.page++;ecsRender();};
 document.querySelectorAll('[data-ecs-open]').forEach(b=>b.onclick=()=>{if(s.dirty&&!confirm('Discard unsaved query changes?'))return;s.dirty=false;s.active=b.dataset.ecsOpen;ecsDetail();});
 document.querySelectorAll('[data-ecs-select]').forEach(b=>b.onchange=()=>{b.checked?s.selected.add(b.dataset.ecsSelect):s.selected.delete(b.dataset.ecsSelect);if(!s.dirty)ecsRender();});
 if(el('ecs-all'))el('ecs-all').onchange=e=>{if(!ecsDiscardDraft()){e.target.checked=false;return;}rows.forEach(r=>e.target.checked?s.selected.add(r.id):s.selected.delete(r.id));ecsRender();};
 if(el('ecs-bulk'))el('ecs-bulk').onclick=()=>ecsSave({operation:'update',items:s.rows.filter(r=>s.selected.has(r.id)).map(r=>({id:r.id,version:Number(r.version)})),status:el('ecs-bulk-status').value});ecsDetail();
}
function ecsDetail(){
 const s=EcsState,r=s.rows.find(r=>r.id===s.active),box=el('ecs-detail');if(!box)return;if(!r){box.innerHTML='';return;}
 const o=s.options,d=ecsJson(r.clientDetails),activities=s.activities.filter(a=>a.queryId===r.id).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
 box.innerHTML=`<div class="card" style="padding:20px"><button class="btn btn-text" id="ecs-close" style="float:right">Close</button><small>${escapeHtml(r.reference)}</small><h2>${escapeHtml(r.subject)}</h2><p>${escapeHtml(ecsLabel(r.status))} · ${escapeHtml(r.sourceName)}</p>${remarkHtml(r.message)}<h3>${escapeHtml(r.companyName)}</h3><p>${escapeHtml(r.requesterName)} · ${escapeHtml(r.requesterPhone||'No phone')}<br>${escapeHtml(r.requesterEmail||'')}</p><details><summary>Original client details</summary>${Object.entries(d).map(([k,v])=>`<p><strong>${escapeHtml(k)}:</strong> ${escapeHtml(v||'—')}</p>`).join('')}</details>
 ${o.canEdit?`<form id="ecs-edit" style="display:grid;gap:12px;margin-top:18px"><h3>Take action</h3><div>${['IN_PROGRESS','WAITING_FOR_CLIENT','RESOLVED','NEW'].filter(v=>v!==r.status).map(v=>`<button type="button" class="btn btn-outlined" data-ecs-quick="${v}">${escapeHtml(ecsLabel(v))}</button>`).join(' ')}</div><label>Status<select class="form-control" name="status">${ecsOptionsHtml(o.statuses,r.status)}</select></label>${o.canManage?`<label>Assigned to<select class="form-control" name="assignedTo"><option value="">Unassigned</option>${r.assignedTo&&!o.assignees.some(u=>u.email===r.assignedTo)?`<option selected value="${escapeHtml(r.assignedTo)}">${escapeHtml(r.assignedTo)}</option>`:''}${o.assignees.map(u=>`<option value="${escapeHtml(u.email)}" ${u.email===r.assignedTo?'selected':''}>${escapeHtml(u.name)} (${escapeHtml(u.email)})</option>`).join('')}</select></label>`:''}<label>Internal note<textarea class="form-control" name="note" maxlength="2000" rows="3"></textarea></label><button class="btn btn-primary">Save update</button></form><details style="margin-top:16px"><summary>Client linking and lead push</summary>${!r.clientId?`<div style="display:flex;gap:8px;margin-top:10px"><input id="ecs-client-search" class="form-control" placeholder="Client name / phone"><button class="btn btn-outlined" id="ecs-client-find">Find client</button></div><select id="ecs-client-results" class="form-control"></select><button id="ecs-link" class="btn btn-outlined">Link selected client</button>${o.canManage?' <button id="ecs-new-client" class="btn btn-outlined">Create client from supplied details</button>':''}`:'<p>Client is linked. Continue the existing lead below.</p>'}<p><button class="btn btn-outlined" id="ecs-check">Check existing leads in all portals</button></p><div id="ecs-matches"></div><form id="ecs-push" style="display:grid;gap:10px"><label>Destination<select name="portalKey" class="form-control"><option value="">Choose portal</option>${o.portals.map(p=>`<option value="${escapeHtml(p.key)}">${escapeHtml(p.name)}</option>`).join('')}</select></label><input type="hidden" name="leadId"><span id="ecs-selected-lead"></span><label>Assigned user<select class="form-control" name="assignedTo"><option value="">Choose destination first</option></select></label><label>Follow-up date<input class="form-control" name="followupDate" type="date"></label><label>Remark<textarea class="form-control" name="remark" maxlength="2000"></textarea></label><button class="btn btn-primary">Push / continue lead</button></form></details>`:''}
 <h3 style="margin-top:20px">Activity & notes (${activities.length})</h3>${activities.map(a=>{const info=ecsJson(a.details);return `<div style="border-top:1px solid var(--md-outline-variant,#ddd);padding:12px 0"><strong>${escapeHtml(ecsLabel(a.action))}</strong> · ${escapeHtml(a.actor)}<br><small>${escapeHtml(a.createdAt)}</small>${info.toStatus?`<p>${escapeHtml(ecsLabel(info.fromStatus||info.toStatus))} → ${escapeHtml(ecsLabel(info.toStatus))}</p>`:''}${info.toAssignee!==undefined?`<p>Assigned: ${escapeHtml(info.toAssignee||'Unassigned')}</p>`:''}${info.note?remarkHtml(info.note):''}${info.leadId?`<p>${escapeHtml(info.portalName||info.portalKey)} · Lead ${escapeHtml(info.leadId)}<br>Follow-up ${escapeHtml(info.followupId||'')}</p>`:''}</div>`;}).join('')}</div>`;
 el('ecs-close').onclick=()=>{if(s.dirty&&!confirm('Discard unsaved changes?'))return;s.active='';s.dirty=false;ecsDetail();};
 const edit=el('ecs-edit');if(!edit)return;box.querySelectorAll('input,select,textarea').forEach(n=>n.addEventListener('input',()=>{s.dirty=true;}));
 const update=()=>({operation:'update',items:[{id:r.id,version:Number(r.version)}],status:edit.status.value,note:edit.note.value,...(o.canManage&&edit.assignedTo.value!==(r.assignedTo||'')?{assignedTo:edit.assignedTo.value}:{})});
 edit.onsubmit=e=>{e.preventDefault();ecsSave(update());};box.querySelectorAll('[data-ecs-quick]').forEach(b=>b.onclick=()=>{edit.status.value=b.dataset.ecsQuick;ecsSave(update());});
 if(el('ecs-client-find'))el('ecs-client-find').onclick=async()=>{try{const clients=await api._read('apiEcsClients',AuthToken.get(),el('ecs-client-search').value);el('ecs-client-results').innerHTML='<option value="">Select client</option>'+clients.map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)} · ${escapeHtml(c.city||'')} · ${escapeHtml(c.sourceName)}</option>`).join('');}catch(e){toast(e.message,'error');}};
 if(el('ecs-link'))el('ecs-link').onclick=()=>ecsSave({operation:'link',id:r.id,version:Number(r.version),clientId:el('ecs-client-results').value});
 if(el('ecs-new-client'))el('ecs-new-client').onclick=()=>ecsSave({operation:'link',id:r.id,version:Number(r.version),createClient:true});
 const push=el('ecs-push');push.portalKey.onchange=async()=>{push.leadId.value='';el('ecs-selected-lead').textContent='';try{const result=await api._read('apiEcsDestinationOptions',AuthToken.get(),push.portalKey.value);push.assignedTo.innerHTML='<option value="">Choose user</option>'+result.users.map(u=>`<option value="${escapeHtml(u.id)}">${escapeHtml(u.name)}</option>`).join('');}catch(e){toast(e.message,'error');}};
 el('ecs-check').onclick=async e=>{e.target.disabled=true;try{const result=await api._read('apiEcsCheckLeads',AuthToken.get(),r.id);el('ecs-matches').innerHTML=result.errors.map(v=>`<p>${escapeHtml(v.portalKey)}: ${escapeHtml(v.message)}</p>`).join('')+result.matches.map((m,i)=>`<p>${escapeHtml(m.name)} · ${escapeHtml(m.portalName)} · ${escapeHtml(m.city||'')} <button class="btn btn-outlined" data-match="${i}">Continue this lead</button></p>`).join('')||'<p>No existing lead found.</p>';el('ecs-matches').querySelectorAll('[data-match]').forEach(b=>b.onclick=async()=>{const m=result.matches[Number(b.dataset.match)];push.portalKey.value=m.portalKey;await push.portalKey.onchange();push.leadId.value=m.leadId;el('ecs-selected-lead').textContent='Existing lead: '+m.name;});}catch(err){toast(err.message,'error');}finally{e.target.disabled=false;}};
 push.onsubmit=e=>{e.preventDefault();ecsSave({id:r.id,version:Number(r.version),portalKey:push.portalKey.value,assignedTo:push.assignedTo.value,leadId:push.leadId.value,followupDate:push.followupDate.value,remark:push.remark.value},'apiEcsPush');};
}
async function ecsRefreshSaved(){EcsState.dirty=false;EcsState.selected.clear();SheetMirror.invalidate();await Promise.all(['ECS_QUERIES','ECS_ACTIVITIES','ECS_CLIENTS'].map(n=>SheetMirror.readSheet(n)));await ecsReadLocal();if(App.currentPage==='ecs')ecsRender();}
async function ecsSave(payload,action='apiEcsSave'){
 const buttons=[...document.querySelectorAll('#ecs-detail button,#ecs-detail input,#ecs-detail select,#ecs-detail textarea,#ecs-bulk')].filter(b=>!b.disabled);buttons.forEach(b=>b.disabled=true);
 try{await PortalSync.submit(action,[payload]);toast('ECS update synced');await ecsRefreshSaved();}
 catch(e){toast(e.message,e.code==='SYNC_PENDING'?'info':'error');if(e.code==='SYNC_PENDING'&&e.operationId)PortalSync.watch(e.operationId,async row=>{if(row.state==='committed'){toast('ECS update synced');await ecsRefreshSaved();}});}
 finally{buttons.forEach(b=>b.disabled=false);}
}
</script>
