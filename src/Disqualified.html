<script>
let dqRows=[],dqTable=null,dqLoadId=0,dqTableReady=Promise.resolve(),dqTableBuilt=false;
function dqRenderStatus(value) {
  const node=el('dq-status');if(!node)return;
  try {const s=JSON.parse(value||'null');node.textContent=!s?'':s.state==='error'?'Transfer needs attention: '+s.message:s.state==='running'?'Transfer in progress: '+s.message:'Last transfer check: '+new Date(s.at).toLocaleString();}catch(_){node.textContent='';}
}
async function loadDisqualified(prefetched) {
  const request=++dqLoadId;
  const current=()=>request===dqLoadId && App.currentPage==='disqualified';
  try {
    const data=prefetched || await pagePreviewRead('apiGetDisqualified',[],value=>loadDisqualified(value),{current});
    if(!current())return;
    dqRows=data.leads;
    const query=el('dq-search')?.value||'';
    if(dqTable && el('dq-table')) {
      const table=dqTable;await dqTableReady;
      if(!current() || table!==dqTable || !el('dq-table'))return;
      await table.replaceData(dqRows);dqFilter();dqRenderStatus(data.status);return;
    }
    el('content').innerHTML='<section class="card" style="padding:22px"><h2>Disqualified leads</h2><p>Central records for this portal. Saved data opens from this browser; updates sync in the background.</p><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><input id="dq-search" class="form-control" style="max-width:360px" placeholder="Search company, contact or phone"><span id="dq-count"></span><button class="btn btn-outlined" id="dq-refresh">Refresh</button>'+(App.user.role==='ADMIN'?'<button class="btn btn-outlined" id="dq-transfer">Transfer pending leads</button>':'')+'</div><p id="dq-status" role="status"></p><div id="dq-table"></div></section>';
    el('dq-search').value=query;
    el('dq-search').addEventListener('input',dqFilter);
    el('dq-refresh').onclick=()=>loadDisqualified();
    if(el('dq-transfer'))el('dq-transfer').onclick=async()=>{const b=el('dq-transfer');b.disabled=true;try{const r=await api._authedRead('apiRunDisqualifiedTransfer');if(r.state!=='committed')throw new Error(r.message||'Transfer will retry.');await PagePreview.invalidate();await loadDisqualified();toast('Transfer batch checked. Remaining entries continue in the background.','success');}catch(e){toast(e.message,'error');}finally{if(b.isConnected)b.disabled=false;}};
    dqRenderStatus(data.status);
    if(dqTable)try{dqTable.destroy();}catch(_){}
    dqTableBuilt=false;
    dqTable=new Tabulator('#dq-table',{data:dqRows,index:'Central Key',height:'60vh',layout:'fitColumns',columns:[
      {title:'Company',field:'Company Name',minWidth:200,formatter:'plaintext'},
      {title:'Contact',field:'Contact Person',formatter:'plaintext'},
      {title:'Phone',field:'Phone',formatter:'plaintext'},
      {title:'City',field:'City',formatter:'plaintext'},
      {title:'Assigned to',field:'Assigned To',formatter:cell=>escapeHtml((App.config.users||[]).find(u=>String(u.id)===String(cell.getValue()))?.name||cell.getValue())},
      {title:'History',headerSort:false,width:95,formatter:()=>'<button class="btn btn-outlined btn-sm">View</button>',cellClick:(_e,cell)=>openDisqualified(cell.getRow().getData()['Lead ID'])}
    ]});
    const table=dqTable;
    dqTableReady=new Promise(resolve=>table.on('tableBuilt',()=>{if(table===dqTable){dqTableBuilt=true;dqFilter();}resolve();}));
  } catch(error){if(current())toast(error.message,'error');}
}
function dqFilter(){const q=String(el('dq-search')?.value||'').toLowerCase();if(dqTable && dqTableBuilt)dqTable.setFilter(row=>!q||['Company Name','Contact Person','Phone','City'].some(k=>String(row[k]||'').toLowerCase().includes(q)));if(el('dq-count'))el('dq-count').textContent=dqRows.filter(row=>!q||['Company Name','Contact Person','Phone','City'].some(k=>String(row[k]||'').toLowerCase().includes(q))).length+' leads';}
async function openDisqualified(id){
  const modal=document.createElement('dialog');modal.style.cssText='width:min(900px,90vw);max-height:85vh;border:0;border-radius:14px;padding:24px';
  modal.innerHTML='<button class="btn btn-outlined" style="float:right" id="dq-close">Close</button><h2>Lead & follow-up history</h2><div id="dq-detail">Opening saved history…</div>';
  document.body.append(modal);modal.showModal();modal.querySelector('#dq-close').onclick=()=>modal.close();modal.onclose=()=>modal.remove();
  const render=data=>{
    if(!modal.open)return;
    const fields=['Company Name','Contact Person','Phone','WhatsApp No','Alternate No','Email','City','State','Address','GST No','Remark','Client Description'];
    const cell=(key,value)=>/Remark|Discussion/.test(key)?remarkHtml(value):escapeHtml(String(value||''));
    const custom=row=>{try{const values=JSON.parse(row['Custom Fields JSON']||'{}');return Object.keys(values).length?'<dl>'+Object.entries(values).map(([key,value])=>'<dt>'+escapeHtml(key)+'</dt><dd>'+cell(key,value)+'</dd>').join('')+'</dl>':'';}catch(_){return '';}};
    const records=(rows,keys)=>rows.length?'<div style="overflow:auto"><table class="table"><thead><tr>'+keys.map(k=>'<th>'+escapeHtml(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+keys.map(k=>'<td style="white-space:pre-wrap;max-width:420px">'+cell(k,row[k])+'</td>').join('')+'</tr>'+(custom(row)?'<tr><td colspan="'+keys.length+'">'+custom(row)+'</td></tr>':'')).join('')+'</tbody></table></div>':'<p>No records.</p>';
    modal.querySelector('#dq-detail').innerHTML='<dl>'+fields.filter(k=>data.lead[k]).map(k=>'<dt><b>'+escapeHtml(k)+'</b></dt><dd>'+cell(k,data.lead[k])+'</dd>').join('')+'</dl>'+custom(data.lead)+'<h3>Follow-ups ('+data.followups.length+')</h3>'+records(data.followups,['Planned Date','Status','Discussion','Outcome'])+'<h3>Follow-up history ('+data.history.length+')</h3>'+records(data.history,['Done Date','Remark','Outcome','Contact Mode','Next Planned Date']);
  };
  try{const data=await pagePreviewRead('apiGetDisqualifiedDetail',[id],render,{current:()=>modal.open});render(data);}catch(e){if(modal.open)modal.querySelector('#dq-detail').textContent=e.message;}
}
</script>
